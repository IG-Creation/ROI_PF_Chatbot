<!DOCTYPE html>
<html lang="en" data-theme="cyber-circuit">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Lendy 🐱 — Smart Loan Pricing & Approval Assistant</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#030712">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="Lendy is your friendly 3D loan pricing and approval deviation assistant.">

  <style>
    /* ==========================================================================
       VIBRANT PHONE WALLPAPER THEMES & COLOR SYSTEM
       ========================================================================== */
    :root, [data-theme="cyber-circuit"] {
      --bg-base: #030712;
      --circuit-line: #00f0ff;
      --circuit-glow: rgba(0, 240, 255, 0.45);
      --circuit-sub: #0284c7;
      --panel-bg: rgba(6, 12, 28, 0.88);
      --card-bg: rgba(10, 20, 42, 0.82);
      --card-hover: rgba(16, 32, 68, 0.92);
      --border-line: rgba(0, 240, 255, 0.28);
      --border-glow: #00f0ff;
      --text-main: #ffffff;
      --text-muted: #bae6fd;
      --text-subtle: #38bdf8;
      --accent-primary: #00f0ff;
      --accent-secondary: #818cf8;
      --accent-hot: #f43f5e;
      --accent-emerald: #10b981;
      --color-green: #34d399;
      --color-green-bg: rgba(52, 211, 153, 0.22);
      --color-blue: #38bdf8;
      --color-blue-bg: rgba(56, 189, 248, 0.22);
      --color-amber: #fbbf24;
      --color-amber-bg: rgba(251, 191, 36, 0.22);
      --color-red: #f87171;
      --color-red-bg: rgba(248, 113, 113, 0.25);
      --btn-grad: linear-gradient(135deg, #00f0ff, #2563eb);
      --bubble-user-grad: linear-gradient(135deg, #0284c7, #4f46e5);
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
    }

    [data-theme="alpine-night"] {
      --bg-base: #0b071a;
      --circuit-line: #c084fc;
      --circuit-glow: rgba(192, 132, 252, 0.45);
      --circuit-sub: #f472b6;
      --panel-bg: rgba(18, 12, 38, 0.88);
      --card-bg: rgba(28, 18, 56, 0.82);
      --card-hover: rgba(42, 28, 80, 0.92);
      --border-line: rgba(244, 114, 182, 0.3);
      --border-glow: #f472b6;
      --text-main: #ffffff;
      --text-muted: #fce7f3;
      --text-subtle: #f472b6;
      --accent-primary: #f472b6;
      --accent-secondary: #c084fc;
      --accent-hot: #fb7185;
      --accent-emerald: #34d399;
      --color-green: #34d399;
      --color-green-bg: rgba(52, 211, 153, 0.22);
      --color-blue: #60a5fa;
      --color-blue-bg: rgba(96, 165, 250, 0.22);
      --color-amber: #fbbf24;
      --color-amber-bg: rgba(251, 191, 36, 0.22);
      --color-red: #f87171;
      --color-red-bg: rgba(248, 113, 113, 0.25);
      --btn-grad: linear-gradient(135deg, #f472b6, #8b5cf6);
      --bubble-user-grad: linear-gradient(135deg, #a855f7, #ec4899);
    }

    [data-theme="cosmic-nebula"] {
      --bg-base: #060114;
      --circuit-line: #a855f7;
      --circuit-glow: rgba(168, 85, 247, 0.45);
      --circuit-sub: #3b82f6;
      --panel-bg: rgba(14, 6, 34, 0.88);
      --card-bg: rgba(26, 12, 54, 0.82);
      --card-hover: rgba(40, 18, 82, 0.92);
      --border-line: rgba(168, 85, 247, 0.3);
      --border-glow: #a855f7;
      --text-main: #ffffff;
      --text-muted: #f3e8ff;
      --text-subtle: #c084fc;
      --accent-primary: #a855f7;
      --accent-secondary: #60a5fa;
      --accent-hot: #f43f5e;
      --accent-emerald: #34d399;
      --color-green: #34d399;
      --color-green-bg: rgba(52, 211, 153, 0.22);
      --color-blue: #60a5fa;
      --color-blue-bg: rgba(96, 165, 250, 0.22);
      --color-amber: #fbbf24;
      --color-amber-bg: rgba(251, 191, 36, 0.22);
      --color-red: #f87171;
      --color-red-bg: rgba(248, 113, 113, 0.25);
      --btn-grad: linear-gradient(135deg, #a855f7, #3b82f6);
      --bubble-user-grad: linear-gradient(135deg, #7c3aed, #2563eb);
    }

    [data-theme="neo-tokyo"] {
      --bg-base: #050714;
      --circuit-line: #f43f5e;
      --circuit-glow: rgba(244, 63, 94, 0.45);
      --circuit-sub: #06b6d4;
      --panel-bg: rgba(10, 14, 28, 0.88);
      --card-bg: rgba(18, 24, 46, 0.82);
      --card-hover: rgba(30, 38, 72, 0.92);
      --border-line: rgba(244, 63, 94, 0.3);
      --border-glow: #f43f5e;
      --text-main: #ffffff;
      --text-muted: #fecdd3;
      --text-subtle: #fda4af;
      --accent-primary: #f43f5e;
      --accent-secondary: #38bdf8;
      --accent-hot: #fbbf24;
      --accent-emerald: #10b981;
      --color-green: #34d399;
      --color-green-bg: rgba(52, 211, 153, 0.22);
      --color-blue: #38bdf8;
      --color-blue-bg: rgba(56, 189, 248, 0.22);
      --color-amber: #fbbf24;
      --color-amber-bg: rgba(251, 191, 36, 0.22);
      --color-red: #f87171;
      --color-red-bg: rgba(248, 113, 113, 0.25);
      --btn-grad: linear-gradient(135deg, #f43f5e, #8b5cf6);
      --bubble-user-grad: linear-gradient(135deg, #e11d48, #6366f1);
    }

    [data-theme="sunset-gold"] {
      --bg-base: #0c0603;
      --circuit-line: #f59e0b;
      --circuit-glow: rgba(245, 158, 11, 0.45);
      --circuit-sub: #ea580c;
      --panel-bg: rgba(24, 10, 6, 0.88);
      --card-bg: rgba(40, 18, 10, 0.82);
      --card-hover: rgba(62, 28, 16, 0.92);
      --border-line: rgba(245, 158, 11, 0.3);
      --border-glow: #f59e0b;
      --text-main: #ffffff;
      --text-muted: #fef3c7;
      --text-subtle: #f59e0b;
      --accent-primary: #f59e0b;
      --accent-secondary: #f43f5e;
      --accent-hot: #ea580c;
      --accent-emerald: #10b981;
      --color-green: #34d399;
      --color-green-bg: rgba(52, 211, 153, 0.22);
      --color-blue: #38bdf8;
      --color-blue-bg: rgba(56, 189, 248, 0.22);
      --color-amber: #fbbf24;
      --color-amber-bg: rgba(251, 191, 36, 0.22);
      --color-red: #f87171;
      --color-red-bg: rgba(248, 113, 113, 0.25);
      --btn-grad: linear-gradient(135deg, #f59e0b, #e11d48);
      --bubble-user-grad: linear-gradient(135deg, #ea580c, #be123c);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-stack);
      font-size: 15px;
      line-height: 1.5;
      position: relative;
    }

    body {
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* ==========================================================================
       WALLPAPER BACKDROPS
       ========================================================================== */
    .wallpaper-art {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      background: var(--bg-base);
    }

    .circuit-bg-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.88;
      object-fit: cover;
      display: none;
    }
    [data-theme="cyber-circuit"] .circuit-bg-svg { display: block; }

    .alpine-bg-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.9;
      object-fit: cover;
      display: none;
    }
    [data-theme="alpine-night"] .alpine-bg-svg { display: block; }

    .bokeh-light {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      opacity: 0.45;
      animation: float-bokeh 16s infinite alternate ease-in-out;
    }
    .b1 { width: 360px; height: 360px; background: var(--circuit-glow); top: -60px; left: -40px; }
    .b2 { width: 420px; height: 420px; background: var(--circuit-sub); bottom: 10%; right: -60px; animation-duration: 20s; }

    @keyframes float-bokeh {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(45px) scale(1.15); }
    }

    /* ==========================================================================
       FRIENDLY HEADER & PROGRESS HUD
       ========================================================================== */
    .app-header {
      background: var(--panel-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--border-line);
      flex-shrink: 0;
      z-index: 30;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.6);
    }

    .header-main-bar {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .header-logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--btn-grad);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 0 16px var(--circuit-glow);
      border: 1px solid rgba(255, 255, 255, 0.25);
      flex-shrink: 0;
    }

    .header-titles {
      min-width: 0;
    }

    .header-titles h1 {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background: linear-gradient(135deg, var(--accent-primary), #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-sub-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .case-live-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 8px;
      border-radius: 9999px;
      background: rgba(0, 240, 255, 0.15);
      color: var(--accent-primary);
      border: 1px solid var(--border-line);
      font-weight: 700;
      font-size: 11px;
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .lang-selector-btn, .theme-selector-btn, .reset-btn {
      min-height: 36px;
      padding: 0 10px;
      background: var(--card-bg);
      border: 1px solid var(--border-line);
      border-radius: 9999px;
      color: var(--text-main);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
      backdrop-filter: blur(10px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      white-space: nowrap;
    }

    .lang-selector-btn:hover, .theme-selector-btn:hover, .reset-btn:hover {
      border-color: var(--border-glow);
      box-shadow: 0 0 12px var(--circuit-glow);
      transform: translateY(-1px);
    }

    .cockpit-stepper-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 16px 8px 16px;
      background: rgba(0, 0, 0, 0.25);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 11px;
    }

    .stepper-steps-track {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      max-width: 600px;
    }

    .stepper-pill {
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.12);
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .stepper-pill.active {
      background: var(--btn-grad);
      box-shadow: 0 0 8px var(--border-glow);
    }

    .stepper-pill.completed {
      background: var(--color-green);
    }

    .stepper-label-text {
      color: var(--text-subtle);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-left: 12px;
      white-space: nowrap;
    }

    /* ==========================================================================
       CONVERSATION FEED
       ========================================================================== */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 175px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      z-index: 10;
      scroll-behavior: smooth;
    }

    .chat-container::-webkit-scrollbar {
      width: 5px;
    }
    .chat-container::-webkit-scrollbar-thumb {
      background: var(--border-line);
      border-radius: 4px;
    }

    .cockpit-feed-row {
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .cockpit-card {
      background: var(--card-bg);
      border: 1px solid var(--border-line);
      border-radius: 20px;
      padding: 18px 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      position: relative;
      transition: all 0.25s ease;
      animation: card-appear 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes card-appear {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .cockpit-card:hover {
      border-color: var(--border-glow);
      box-shadow: 0 10px 35px var(--circuit-glow);
    }

    .cockpit-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .cockpit-cat-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent-primary);
    }

    .cockpit-3d-badge {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: var(--btn-grad);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 12px var(--circuit-glow);
    }

    .cockpit-step-counter {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.06);
      padding: 3px 8px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .cockpit-card-body {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-main);
    }

    .cockpit-card-body strong {
      color: #ffffff;
      font-weight: 700;
    }

    .user-confirm-row {
      display: flex;
      justify-content: flex-end;
      margin-top: -4px;
    }

    .user-confirm-pill {
      background: var(--bubble-user-grad);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 16px;
      border-top-right-radius: 4px;
      font-weight: 600;
      font-size: 14.5px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.25);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .cockpit-options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    @media (max-width: 600px) {
      .cockpit-options-grid { grid-template-columns: 1fr; }
    }

    .action-tile-3d {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-line);
      border-radius: 16px;
      padding: 12px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      text-align: left;
      color: var(--text-main);
      backdrop-filter: blur(10px);
    }

    .action-tile-3d:hover {
      background: var(--card-hover);
      border-color: var(--border-glow);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--circuit-glow);
    }

    .action-tile-3d.primary-glow {
      border-color: var(--accent-primary);
      background: rgba(0, 240, 255, 0.12);
      box-shadow: 0 0 14px var(--circuit-glow);
    }

    .tile-icon-3d {
      font-size: 24px;
      flex-shrink: 0;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
    }

    .tile-text-group {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .tile-title {
      font-size: 13.5px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tile-desc {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .chips-area {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 16px;
      max-width: 820px;
      margin: 0 auto;
      z-index: 20;
    }

    .action-chip {
      min-height: 42px;
      padding: 0 16px;
      background: var(--card-bg);
      border: 1px solid var(--border-line);
      border-radius: 9999px;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(14px);
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.35);
    }

    .action-chip:hover {
      background: var(--card-hover);
      border-color: var(--border-glow);
      transform: translateY(-2px);
      box-shadow: 0 0 14px var(--circuit-glow);
    }

    .action-chip.primary-glow {
      border-color: var(--accent-primary);
      box-shadow: 0 0 12px var(--circuit-glow);
      background: rgba(0, 240, 255, 0.12);
    }

    /* ==========================================================================
       VERDICT CARD & MOBILE PARAMETER CARDS
       ========================================================================== */
    .status-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-line);
      border-radius: 18px;
      overflow: hidden;
      margin-top: 14px;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.6);
    }

    .status-card-header {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 15px;
      border-bottom: 1px solid var(--border-line);
    }

    .status-card-header.green { background: var(--color-green-bg); color: var(--color-green); border-bottom-color: rgba(52, 211, 153, 0.4); }
    .status-card-header.blue  { background: var(--color-blue-bg);  color: var(--color-blue);  border-bottom-color: rgba(56, 189, 248, 0.4); }
    .status-card-header.amber { background: var(--color-amber-bg); color: var(--color-amber); border-bottom-color: rgba(251, 191, 36, 0.4); }
    .status-card-header.red   { background: var(--color-red-bg);   color: var(--color-red);   border-bottom-color: rgba(248, 113, 113, 0.4); }

    .status-card-body {
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.02);
      font-size: 13.5px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-line);
      line-height: 1.6;
    }

    .floor-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 800;
      background: var(--color-red-bg);
      color: var(--color-red);
      border: 1px solid rgba(248, 113, 113, 0.4);
      margin-bottom: 8px;
    }

    .comparison-table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    .comparison-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }

    .comparison-table th, .comparison-table td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border-line);
    }

    .comparison-table th {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.05em;
    }

    .comparison-table td:last-child, .comparison-table th:last-child {
      text-align: right;
    }

    .mobile-param-cards {
      display: none;
      padding: 12px;
      gap: 10px;
      flex-direction: column;
    }

    @media (max-width: 650px) {
      .comparison-table-wrapper { display: none; }
      .mobile-param-cards { display: flex; }
    }

    .param-card-mobile {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-line);
      border-radius: 14px;
      padding: 12px 14px;
    }

    .param-card-title {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--accent-primary);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .param-values-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      text-align: center;
      margin-bottom: 8px;
    }

    .param-val-box {
      background: rgba(0, 0, 0, 0.35);
      border-radius: 8px;
      padding: 6px 4px;
    }

    .param-val-lbl {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .param-val-num {
      font-size: 13.5px;
      font-weight: 800;
      color: #ffffff;
      margin-top: 2px;
    }

    .tag-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 9999px;
      font-size: 11.5px;
      font-weight: 700;
    }

    .tag-badge.favorable { background: var(--color-green-bg); color: var(--color-green); border: 1px solid rgba(52, 211, 153, 0.3); }
    .tag-badge.cbo { background: var(--color-blue-bg); color: var(--color-blue); border: 1px solid rgba(96, 165, 250, 0.3); }
    .tag-badge.coo { background: var(--color-amber-bg); color: var(--color-amber); border: 1px solid rgba(251, 191, 36, 0.3); }
    .tag-badge.ceo { background: var(--color-red-bg); color: var(--color-red); border: 1px solid rgba(248, 113, 113, 0.3); }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 14px;
      background: rgba(0, 0, 0, 0.3);
    }

    @media (min-width: 600px) {
      .summary-grid { grid-template-columns: repeat(4, 1fr); }
    }

    .stat-cell {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-line);
      border-radius: 12px;
      padding: 12px;
    }

    .stat-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-subtle);
      font-weight: 700;
      margin-bottom: 4px;
    }

    .stat-num {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-main);
    }

    .stat-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .alert-banner {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 600;
    }

    .alert-banner.amber {
      background: var(--color-amber-bg);
      color: var(--color-amber);
      border-top: 1px solid rgba(251, 191, 36, 0.3);
    }

    /* ==========================================================================
       3D ROBOT CAT COMPANION
       ========================================================================== */
    .companion-dock {
      position: fixed;
      right: 18px;
      bottom: 74px;
      width: 125px;
      height: 155px;
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .companion-dock {
        right: 12px;
        bottom: 76px;
        width: 105px;
        height: 135px;
        transform: scale(0.92);
        transform-origin: right bottom;
      }
    }

    .holo-pedestal {
      position: absolute;
      bottom: 2px;
      width: 90px;
      height: 24px;
      border-radius: 50%;
      background: radial-gradient(ellipse, var(--circuit-glow) 0%, rgba(0, 240, 255, 0.1) 40%, transparent 70%);
      border: 1px solid var(--circuit-glow);
      box-shadow: 0 0 18px var(--circuit-glow);
      animation: holo-scan 3s infinite alternate ease-in-out;
      pointer-events: none;
    }

    @keyframes holo-scan {
      0% { transform: scale(0.95); opacity: 0.6; }
      100% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 24px var(--border-glow); }
    }

    .robot-cat-interactive {
      position: relative;
      width: 110px;
      height: 140px;
      pointer-events: auto;
      cursor: pointer;
      transform-origin: center bottom;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .companion-speech {
      position: absolute;
      bottom: 142px;
      right: 6px;
      background: var(--panel-bg);
      border: 1px solid var(--border-glow);
      padding: 7px 14px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-primary);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transform: translateY(8px) scale(0.85);
      transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
      z-index: 50;
    }

    .companion-speech.active {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .companion-speech::after {
      content: "";
      position: absolute;
      bottom: -6px;
      right: 36px;
      border-width: 6px 6px 0;
      border-style: solid;
      border-color: var(--border-glow) transparent transparent;
    }

    @keyframes cat-idle-breathe {
      0%, 100% { transform: translateY(0) scaleY(1); }
      50% { transform: translateY(-3px) scaleY(1.02); }
    }
    .anim-breathe { animation: cat-idle-breathe 2.6s infinite ease-in-out; }

    @keyframes cat-tail-wag {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(26deg); }
    }
    .anim-tail { transform-origin: 26px 105px; animation: cat-tail-wag 2s infinite ease-in-out; }

    @keyframes ear-twitch {
      0%, 85%, 100% { transform: rotate(0deg); }
      90% { transform: rotate(-5deg); }
      95% { transform: rotate(4deg); }
    }
    .anim-headphones { transform-origin: 60px 45px; animation: ear-twitch 5s infinite; }

    @keyframes reactor-pulse {
      0%, 100% { opacity: 0.65; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.18); filter: drop-shadow(0 0 8px #00f0ff); }
    }
    .anim-core { transform-origin: 60px 88px; animation: reactor-pulse 1.8s infinite ease-in-out; }

    @keyframes paw-wash-face {
      0% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-10px, -24px) rotate(-35deg); }
      40% { transform: translate(-16px, -28px) rotate(-45deg); }
      60% { transform: translate(-8px, -20px) rotate(-30deg); }
      80% { transform: translate(-14px, -26px) rotate(-40deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }
    .washing-face .arm-right-paw {
      animation: paw-wash-face 1.8s infinite ease-in-out !important;
      transform-origin: 78px 84px;
    }

    @keyframes head-tilt-wash {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(6deg) translateY(-2px); }
    }
    .cat-head-group {
      transform-origin: 60px 45px;
      transition: transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .arm-left-paw {
      transform-origin: 34px 76px;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .arm-right-paw {
      transform-origin: 86px 76px;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .washing-face .cat-head-group {
      animation: head-tilt-wash 1.8s infinite ease-in-out;
      transform-origin: 60px 48px;
    }

    @keyframes visor-scan {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 6px #00f0ff); }
      50% { opacity: 1; filter: drop-shadow(0 0 12px #38bdf8); }
    }
    .calculating-now #cyberVisor {
      display: block !important;
      animation: visor-scan 1s infinite alternate;
    }

    @keyframes cat-laugh-bounce {
      0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
      20% { transform: translateY(-7px) rotate(-4deg) scale(1.08); }
      40% { transform: translateY(0) rotate(4deg) scale(1.04); }
      60% { transform: translateY(-8px) rotate(-3deg) scale(1.1); }
      80% { transform: translateY(-2px) rotate(2deg) scale(1.05); }
    }
    .laughing-now { animation: cat-laugh-bounce 0.65s infinite ease-in-out !important; }

    @keyframes cat-tremble {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-2px, 1px); }
      40% { transform: translate(2px, -1px); }
      60% { transform: translate(-1px, -2px); }
      80% { transform: translate(1px, 2px); }
    }
    .worried-alert {
      animation: cat-tremble 0.3s infinite ease-in-out !important;
    }

    .posture-4legs .torso-body { transform: translateY(10px) scaleY(0.9); transform-origin: center bottom; transition: transform 0.4s ease; }
    .posture-4legs .hind-standing-legs { opacity: 0; transition: opacity 0.3s; }
    .posture-4legs .hind-folded-legs { opacity: 1; transition: opacity 0.3s; }
    .posture-4legs .front-paws-floor { opacity: 1; transition: opacity 0.3s; }

    .posture-2legs .torso-body { transform: translateY(0) scaleY(1); transform-origin: center bottom; transition: transform 0.4s ease; }
    .posture-2legs .hind-standing-legs { opacity: 1; transition: opacity 0.3s; }
    .posture-2legs .hind-folded-legs { opacity: 0; transition: opacity 0.3s; }
    .posture-2legs .front-paws-floor { opacity: 0; transition: opacity 0.3s; }

    /* ==========================================================================
       FULL WIDTH SPACIOUS INPUT BAR
       ========================================================================== */
    .input-bar-container {
      background: var(--panel-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-top: 1px solid var(--border-line);
      padding: 10px 16px;
      flex-shrink: 0;
      z-index: 30;
      position: relative;
    }

    .input-row-wrapper {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
    }

    .input-field-wrapper {
      flex: 1;
      position: relative;
    }

    .chat-input {
      width: 100%;
      min-height: 48px;
      background: var(--card-bg);
      border: 1px solid var(--border-line);
      border-radius: 9999px;
      padding: 12px 22px;
      color: var(--text-main);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
    }

    .chat-input:focus {
      border-color: var(--border-glow);
      box-shadow: 0 0 16px var(--circuit-glow);
    }

    .chat-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .send-action-btn {
      min-width: 48px;
      min-height: 48px;
      width: 48px;
      height: 48px;
      background: var(--btn-grad);
      color: #ffffff;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
      box-shadow: 0 0 16px var(--circuit-glow);
    }

    .send-action-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 22px var(--border-glow);
    }

    .send-action-btn:active {
      transform: scale(0.94);
    }

    .send-action-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .send-action-btn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
      margin-left: 2px;
    }

    .input-hint-line {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 5px;
      text-align: center;
    }
  </style>
</head>
<body>

        </filter>
        <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="var(--circuit-line)" stop-opacity="0.9"/>

      <g stroke="rgba(255,255,255,0.03)" stroke-width="1">

        <circle cx="80" cy="620" r="4.5"/><circle cx="560" cy="940" r="4.5"/>

    </svg>

    <!-- Theme 2: Midnight Alpine Moonlight (User's Image) -->
    <svg class="alpine-bg-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#0b071a"/>

      <circle cx="400" cy="340" r="42" fill="url(#moonGlow)"/>

    <div class="bokeh-light b1"></div>
    <div class="bokeh-light b2"></div>

  <!-- Header -->
  <header class="app-header">
    <div class="header-main-bar">
      <div class="header-left">
        <div class="header-logo">🐱</div>
        <div class="header-titles">
          <h1>Lendy AI</h1>
          <div class="header-sub-row">
            <span id="caseLiveBadge" class="case-live-badge">📋 Case: Unset</span>
            <span id="langSubText">English</span>
          </div>
        </div>
      </div>

      <div class="header-actions">
        <button class="lang-selector-btn" id="langBtn" onclick="cycleLanguage()" title="Switch Language">
          <span>🌐</span>
          <span id="currentLangLabel">EN</span>
        </button>

        <button class="theme-selector-btn" id="themeBtn" onclick="cycleWallpaperTheme()" title="Switch Wallpaper">
          <span id="themeEmoji">⚡</span>
        </button>

        <button class="reset-btn" onclick="restartSession()" title="Restart">
          <span>🔄</span>
        </button>
      </div>
    </div>

    <!-- Stepper Pipeline HUD -->
    <div class="cockpit-stepper-bar">
      <div class="stepper-steps-track">
        <div class="stepper-pill active" id="stepPill1" title="1. Details"></div>
        <div class="stepper-pill" id="stepPill2" title="2. Terms"></div>
        <div class="stepper-pill" id="stepPill3" title="3. Financials"></div>
        <div class="stepper-pill" id="stepPill4" title="4. Proposed"></div>
        <div class="stepper-pill" id="stepPill5" title="5. Verdict"></div>
      </div>
      <div class="stepper-label-text" id="stepperStageLabel">1. Customer Profile</div>
    </div>
  </header>

  <!-- Conversation Feed -->
  <main class="chat-container" id="chatContainer" aria-live="polite"></main>

  <!-- Quick Reply Tappable Chips -->
  <div class="chips-area" id="chipsArea" role="group" aria-label="Quick response options"></div>

  <!-- 3D Robot Cat Companion Stage -->
  <div class="companion-dock" id="companionDock">
    <div class="holo-pedestal"></div>
    <div class="companion-speech" id="companionBubble">Ready to help! 🐾</div>

    <div class="robot-cat-interactive anim-breathe posture-2legs" id="robotCat" onclick="catInteractedManually()" title="I'm Lendy! I react to your inputs and make cute faces!">
      <svg viewBox="0 0 120 150" style="width: 100%; height: 100%; overflow: visible;">
        <defs>
          <linearGradient id="whiteCeramic" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="45%" stop-color="#f8fafc"/>
            <stop offset="80%" stop-color="#e2e8f0"/>
            <stop offset="100%" stop-color="#94a3b8"/>
          </linearGradient>

          <linearGradient id="glossHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
          </linearGradient>

          <linearGradient id="hpOrange" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fbbf24"/>
            <stop offset="100%" stop-color="#ea580c"/>

    /* ==========================================================================
       EXACT FINANCIAL, EMI, DTI & APPROVAL CONCESSION LOGIC
       ========================================================================== */
    function lookupBaseRates(product, ticket, incomeProg, propType, bureau) {
      const match = CONFIG.MATRIX.find(m =>
        m.product === product &&
        m.ticket === ticket &&
        m.income === incomeProg &&
        m.prop === propType &&
        m.bureau === bureau
      );
      return match ? { baseRoi: match.baseRoi, basePf: match.basePf } : null;
    }

    function calculateReducingEMI(principal, annualRatePercent, tenureMonths) {
      if (!principal || principal <= 0 || !tenureMonths || tenureMonths <= 0) return 0;
      if (!annualRatePercent || annualRatePercent <= 0) return Math.round(principal / tenureMonths);
      const r = (annualRatePercent / 12.0) / 100.0;
      const factor = Math.pow(1 + r, tenureMonths);
      const emi = (principal * r * factor) / (factor - 1);
      return Math.round(emi);
    }
    const calculateEMI = calculateReducingEMI;

    function calculateDTI(existingEmis, newEmi, monthlyIncome) {
      if (!monthlyIncome || monthlyIncome <= 0) {
        return { currentDti: 0, updatedDti: 0, warning: false };
      }
      const cur = (existingEmis / monthlyIncome) * 100.0;
      const upd = ((existingEmis + newEmi) / monthlyIncome) * 100.0;
      return {
        currentDti: parseFloat(cur.toFixed(1)),
        updatedDti: parseFloat(upd.toFixed(1)),
        warning: upd > CONFIG.DTI_LIMIT_PERCENT
      };
    }

    /*
     * APPROVAL RULES:
     * - roiDrop = Base ROI - Requested ROI
     * - pfDrop  = Base PF  - Requested PF
     *
     * Approver tiers for ROI:
     *   - roiDrop <= 0 -> NONE (meets/exceeds base rate)
     *   - roiDrop <= 2.0 -> CBO
     *   - roiDrop > 2.0 and <= 4.0 -> COO
     *   - roiDrop > 4.0 -> CEO
     *
     * Approver tiers for PF:
     *   - pfDrop <= 0 -> NONE (meets/exceeds base fee)
     *   - pfDrop <= 1.0 -> CBO
     *   - pfDrop > 1.0 and <= 1.5 -> COO
     *   - pfDrop > 1.5 -> CEO
     *
     * Hard Floor Rules:
     *   - If requested ROI < 15.0% -> CEO by default
     *   - If requested PF < 1.5%   -> CEO by default
     *
     * Final Authority:
     *   - Higher authority governs (CEO > COO > CBO > NONE)
     */
    function evaluateApproval(baseRoi, reqRoi, basePf, reqPf) {
      const tol = CONFIG.ROUNDING_TOLERANCE;
      const roiDrop = parseFloat((baseRoi - reqRoi).toFixed(4));
      const pfDrop  = parseFloat((basePf - reqPf).toFixed(4));

      const isRoiFloor = reqRoi < (CONFIG.ROI_FLOOR_PERCENT - tol);
      const isPfFloor  = reqPf  < (CONFIG.PF_FLOOR_PERCENT - tol);

      // ROI tier
      let roiApprover = CONFIG.APPROVERS.NONE;
      if (isRoiFloor) {
        roiApprover = CONFIG.APPROVERS.CEO;
      } else if (roiDrop > tol) {
        if (roiDrop <= 2.0 + tol) {
          roiApprover = CONFIG.APPROVERS.CBO;
        } else if (roiDrop <= 4.0 + tol) {
          roiApprover = CONFIG.APPROVERS.COO;
        } else {
          roiApprover = CONFIG.APPROVERS.CEO;
        }
      }

      // PF tier
      let pfApprover = CONFIG.APPROVERS.NONE;
      if (isPfFloor) {
        pfApprover = CONFIG.APPROVERS.CEO;
      } else if (pfDrop > tol) {
        if (pfDrop <= 1.0 + tol) {
          pfApprover = CONFIG.APPROVERS.CBO;
        } else if (pfDrop <= 1.5 + tol) {
          pfApprover = CONFIG.APPROVERS.COO;
        } else {
          pfApprover = CONFIG.APPROVERS.CEO;
        }
      }

      // Final highest authority
      const finalLevel = Math.max(roiApprover.level, pfApprover.level);
      let finalApprover = CONFIG.APPROVERS.NONE;
      if (finalLevel === 3) finalApprover = CONFIG.APPROVERS.CEO;
      else if (finalLevel === 2) finalApprover = CONFIG.APPROVERS.COO;
      else if (finalLevel === 1) finalApprover = CONFIG.APPROVERS.CBO;

      // Soft human explanation
      let explanation = "";
      if (isRoiFloor || isPfFloor) {
        if (isRoiFloor && isPfFloor) {
          explanation = `Requested ROI (${reqRoi.toFixed(2)}% < 15.0%) and Requested PF (${reqPf.toFixed(2)}% < 1.5%) are both below the minimum floor limits, so <strong>CEO Approval is required by default</strong>.`;
        } else if (isRoiFloor) {
          explanation = `Requested ROI (${reqRoi.toFixed(2)}%) is below the policy floor of 15.0%, so <strong>CEO Approval is required by default</strong>.`;
        } else {
          explanation = `Requested Processing Fee (${reqPf.toFixed(2)}%) is below the policy floor of 1.5%, so <strong>CEO Approval is required by default</strong>.`;
        }
      } else if (finalApprover.level === 0) {
        explanation = `Great news! The requested rates (${reqRoi.toFixed(2)}% ROI, ${reqPf.toFixed(2)}% PF) meet or exceed the benchmark base rates. <strong>No concession approval needed.</strong>`;
      } else {
        const parts = [];
        if (roiApprover.level > 0) {
          parts.push(`ROI drops by ${roiDrop.toFixed(2)}% from base (${roiApprover.name.replace(' Approval','')})`);
        }
        if (pfApprover.level > 0) {
          parts.push(`PF drops by ${pfDrop.toFixed(2)}% from base (${pfApprover.name.replace(' Approval','')})`);
        }
        explanation = `${parts.join(" and ")} — higher authority governing is <strong>${finalApprover.name}</strong>.`;
      }

      return {
        roiDeviation: roiDrop,
        pfDeviation: pfDrop,
        roiApprover,
        pfApprover,
        finalApprover,
        color: finalApprover.color,
        explanation,
        isFloorBreached: isRoiFloor || isPfFloor
      };
    }

    function formatINR(val) {
      if (val === null || val === undefined || isNaN(val)) return "₹0";
      const rounded = Math.round(val);
      const str = Math.abs(rounded).toString();
      let lastThree = str.substring(str.length - 3);
      const otherNumbers = str.substring(0, str.length - 3);
      if (otherNumbers !== '') {
        lastThree = ',' + lastThree;
      }
      const formatted = otherNumbers.replace(/\B(?=(\d{2})+(?!\d))/g, ",") + lastThree;
      return (rounded < 0 ? "-₹" : "₹") + formatted;
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function parseNumber(input) {
      if (!input) return null;
      let clean = String(input).toLowerCase().replace(/,/g, "").trim();
      const crMatch = clean.match(/([\d.]+)\s*(?:cr|crore|crores)/);
      if (crMatch) return parseFloat(crMatch[1]) * 10000000;
      const lacMatch = clean.match(/([\d.]+)\s*(?:lakh|lakhs|lac|lacs|l)/);
      if (lacMatch) return parseFloat(lacMatch[1]) * 100000;
      const numMatch = clean.match(/[\d.]+/);
      if (numMatch) {
        const parsed = parseFloat(numMatch[0]);
        return isNaN(parsed) ? null : parsed;
      }
      return null;
    }

    function parseTenureMonths(input) {
      if (!input) return null;
      const clean = String(input).toLowerCase().replace(/,/g, "").trim();
      const yrMatch = clean.match(/([\d.]+)\s*(?:year|years|yr|yrs|y)/);
      if (yrMatch) return Math.round(parseFloat(yrMatch[1]) * 12);
      const moMatch = clean.match(/(\d+)\s*(?:month|months|mo|mos|m)?/);
      if (moMatch) return parseInt(moMatch[1], 10);
      return null;
    }

    function reactCatToUserResponse(step, rawValue, displayLabel) {

          break;
        case STEPS.PRODUCT:
          reaction = "excited";
          remark = rawValue === "R" ? "Regular Secured Business Loan! Prime collateral 🏢" : (rawValue === "W" ? "Secured Working Capital! 🏭" : "Hypothecation Loan! 🚗");
          break;
        case STEPS.INCOME_PROGRAM:
          reaction = "joyful";
          remark = rawValue === "D" ? "Documented program gets the sharpest rates 📑" : "Assessment program selected! 🔍";
          break;
        case STEPS.PROPERTY_TYPE:
          reaction = "joyful";
          remark = rawValue === "SORP" ? "Self-occupied residential property is prime collateral 🏠" : "Commercial property registered! 🏬";
          break;
        case STEPS.BUREAU:
          if (rawValue === "G") {
            reaction = "excited";
            remark = "Score 700+ or NTC! Top-tier credit rating ⭐";
          } else {
            reaction = "worried";
            remark = "Score under 700. Checking base matrix rates ⚠️";
          }
          break;
        case STEPS.SANC_AMOUNT:
          reaction = "curious";
          const amt = parseNumber(rawValue);
          remark = amt ? `Loan amount ${formatINR(amt)} recorded! 💰` : "Loan amount noted! 💰";
          break;
        case STEPS.SANC_TENURE:
          reaction = "curious";
          const ten = parseTenureMonths(rawValue);
          remark = ten ? `${ten} months tenure locked in! ⏳` : "Tenure noted! ⏳";
          break;
        case STEPS.SANC_ROI:
        case STEPS.SANC_PF:
          reaction = "thinking";
          remark = "Sanctioned terms noted! 📈";
          break;
        case STEPS.INCOME_FREQ:
          reaction = "curious";
          remark = rawValue === "Annual" ? "Yearly income mode 📊" : "Monthly income mode 📅";
          break;
        case STEPS.INCOME_AMOUNT:
        case STEPS.EXISTING_EMIS:
          reaction = "thinking";
          remark = "Computing obligations & DTI ratio ⚖️";
          break;
        case STEPS.REQ_ROI:
          const numRoi = parseFloat(String(rawValue).replace(/%/g, ''));
          if (!isNaN(numRoi)) {
            if (numRoi < CONFIG.ROI_FLOOR_PERCENT) {
              reaction = "worried";
              remark = `Under 15% (${numRoi}%)! Mandates CEO approval 🏛️`;
            } else if (numRoi < session.baseRoi) {
              const drop = session.baseRoi - numRoi;
              reaction = drop > 2.0 ? "worried" : "thinking";
              remark = `${drop.toFixed(1)}% rate concession requested! ⚡`;
            } else {
              reaction = "excited";
              remark = "Rate meets or beats benchmark base! 🎉";
            }
          }
          break;
        case STEPS.REQ_PF:

              remark = "Evaluating approval bands & final comparison... 🎯";
            }
          }
          break;
        case STEPS.COMPLETED:
          reaction = "excited";
          remark = "Let's test another combination! 🚀";
          break;
      }

      turnCatFaceToChat(reaction, remark);

      setTimeout(() => {
        turnCatFaceStraight();
      }, 950);

          break;
        case STEPS.INCOME_FREQ:
          if (clean.toLowerCase().includes("ann")) return "📊 Yearly Earnings";
          return "📅 Monthly Earnings";
        case STEPS.INCOME_AMOUNT:
          const pInc = parseNumber(clean);
          if (pInc && pInc > 0) return `💵 ${formatINR(pInc)}${session.incomeFreq === "Annual" ? " / yr" : " / mo"}`;
          break;
        case STEPS.EXISTING_EMIS:
          const pEmi = parseNumber(clean);
          if (pEmi === 0) return "⚖️ ₹0 (No existing EMIs)";
          if (pEmi && pEmi > 0) return `⚖️ ${formatINR(pEmi)} / mo`;
          break;
        case STEPS.REQ_ROI:
          const pReqRoi = parseFloat(clean.replace(/%/g, ''));
          if (!isNaN(pReqRoi)) return `🎯 ${pReqRoi.toFixed(2)}% Requested ROI`;
          break;
        case STEPS.REQ_PF:
          const pReqPf = parseFloat(clean.replace(/%/g, ''));
          if (!isNaN(pReqPf)) return `🏷️ ${pReqPf.toFixed(2)}% Requested PF`;
          break;
      }
      return clean;
    }

            appendBotCard({
              categoryBadge: "CHECK PF",
              icon3d: "💡",
              stepText: "HELP",
              htmlContent: "Please enter a valid Processing Fee percentage (0 - 15%):",
              chips: [{ label: `${session.basePf}%`, value: String(session.basePf) }],
              catMood: "curious"
            });
            return;
          }
          session.reqPf = numReqPf;
          session.step = STEPS.COMPLETED;
          updateStepperUI();
          inputHint.textContent = "Review results or test another rate";
          userInput.placeholder = "Click 'Try different ROI/PF' or 'New customer'";
          renderFinalExecutiveReport();
          break;

        case STEPS.COMPLETED:
          if (clean === "re_evaluate_rates" || clean.toLowerCase().includes("try") || clean.toLowerCase().includes("different")) {
            reAskProposedRates();
          } else if (clean === "new_case" || clean.toLowerCase().includes("new")) {
            restartSession();
          } else {
            appendBotCard({
              categoryBadge: "OPTIONS",
              icon3d: "✨",
              stepText: "STEP 5 OF 5",
              htmlContent: "Would you like to test another rate concession or evaluate a new customer?",
              chips: [
                { label: t("btnTryRates"), icon: "✏️", primary: true, value: "re_evaluate_rates" },
                { label: t("btnNewCase"), icon: "👤", value: "new_case" }
              ],
              catMood: "standing-proud"
            });
          }
          break;
      }
    }

    /* ==========================================================================
       FINAL COMPARATIVE VERDICT COCKPIT
       ========================================================================== */
    function renderFinalExecutiveReport() {
      const approval = evaluateApproval(session.baseRoi, session.reqRoi, session.basePf, session.reqPf);
      const reqEmi = calculateReducingEMI(session.sancAmount, session.reqRoi, session.sancTenure);
      const emiSavings = session.sancEmi - reqEmi;
      const baseEmi = calculateReducingEMI(session.sancAmount, session.baseRoi, session.sancTenure);

      const sancPfAmount = (session.sancAmount * session.sancPf) / 100.0;
      const reqPfAmount = (session.sancAmount * session.reqPf) / 100.0;
      const pfSavings = sancPfAmount - reqPfAmount;

      const dtiResult = calculateDTI(session.existingEmis, reqEmi, session.monthlyIncome);

      let mood = "standing-proud";
      let verdictSpeech = "";
      if (approval.finalApprover.level === 0) {
        mood = "celebrating";
        verdictSpeech = "🎉 Direct approval! Zero policy concessions needed!";
      } else if (approval.isFloorBreached || approval.finalApprover.level === 3) {
        mood = "worried-alert";
        verdictSpeech = "🏛️ CEO Approval Required (Policy Floor / Deep concession)!";
      } else if (approval.finalApprover.level === 2) {
        mood = "curious";
        verdictSpeech = "⚡ COO Approval needed for this rate concession!";
      } else if (approval.finalApprover.level === 1) {
        mood = "joyful";
        verdictSpeech = "😺 CBO Approval required — standard branch tier!";
      }
      setCatVisualState(mood);
      companionSpeech(verdictSpeech, 3600);

      let roiTag = "";
      if (session.reqRoi < CONFIG.ROI_FLOOR_PERCENT) {
        roiTag = `<span class="tag-badge ceo">Floor Breach (<15%) ➔ CEO</span>`;
      } else if (approval.roiDeviation <= 0) {
        roiTag = `<span class="tag-badge favorable">No Concession</span>`;
      } else {
        roiTag = `<span class="tag-badge ${approval.roiApprover.tag}">-${approval.roiDeviation.toFixed(2)}% drop ➔ ${approval.roiApprover.name.replace(' Approval','')}</span>`;
      }

      let pfTag = "";
      if (session.reqPf < CONFIG.PF_FLOOR_PERCENT) {
        pfTag = `<span class="tag-badge ceo">Floor Breach (<1.5%) ➔ CEO</span>`;
      } else if (approval.pfDeviation <= 0) {
        pfTag = `<span class="tag-badge favorable">No Concession</span>`;
      } else {
        pfTag = `<span class="tag-badge ${approval.pfApprover.tag}">-${approval.pfDeviation.toFixed(2)}% drop ➔ ${approval.pfApprover.name.replace(' Approval','')}</span>`;
      }

      let bannerTitle = "";
      if (approval.isFloorBreached) {
        bannerTitle = `🏛️ CEO Approval Required (Policy Floor Rule)`;
      } else if (approval.finalApprover.level === 0) {
        bannerTitle = `✅ No Approval Needed (Standard Benchmark Rates)`;
      } else {
        bannerTitle = `📑 ${approval.finalApprover.name} Required`;
      }

      const floorAlertHtml = approval.isFloorBreached ? `
        <div class="floor-badge">
          ${t("floorAlert")}: Proposed ${session.reqRoi < CONFIG.ROI_FLOOR_PERCENT ? `ROI (${session.reqRoi}% < 15%)` : ''} ${session.reqPf < CONFIG.PF_FLOOR_PERCENT ? `PF (${session.reqPf}% < 1.5%)` : ''}
        </div>` : "";

      const dtiAlertHtml = dtiResult.warning ? `
        <div class="alert-banner amber">
          <span>${t("dtiAlertTitle")}: Updated DTI of <strong>${dtiResult.updatedDti}%</strong> exceeds 50% prudent ceiling.</span>
        </div>` : "";

      const reportHtml = `
        <div class="status-card">
          <div class="status-card-header ${approval.color}">
            <span>${bannerTitle}</span>
          </div>
          <div class="status-card-body">
            ${floorAlertHtml}
            ${approval.explanation}
          </div>

          <!-- Desktop View: Table -->
          <div class="comparison-table-wrapper">
            <table class="comparison-table">
              <thead>
                <tr>
                  <th>${t("tableHeader")[0]}</th>
                  <th>${t("tableHeader")[1]}</th>
                  <th>${t("tableHeader")[2]}</th>
                  <th>${t("tableHeader")[3]}</th>
                  <th>${t("tableHeader")[4]}</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td><strong>ROI (% p.a.)</strong></td>
                  <td>${session.baseRoi.toFixed(2)}%</td>
                  <td>${session.sancRoi.toFixed(2)}%</td>
                  <td><strong>${session.reqRoi.toFixed(2)}%</strong></td>
                  <td>${roiTag}</td>
                </tr>
                <tr>
                  <td><strong>Processing Fee</strong></td>
                  <td>${session.basePf.toFixed(2)}%</td>
                  <td>${session.sancPf.toFixed(2)}% (${formatINR(sancPfAmount)})</td>
                  <td><strong>${session.reqPf.toFixed(2)}% (${formatINR(reqPfAmount)})</strong></td>
                  <td>${pfTag}</td>
                </tr>
                <tr>
                  <td><strong>Monthly EMI</strong></td>
                  <td>${formatINR(baseEmi)}</td>
                  <td>${formatINR(session.sancEmi)}</td>
                  <td><strong>${formatINR(reqEmi)}</strong></td>
                  <td><span class="tag-badge ${emiSavings >= 0 ? 'favorable' : 'cbo'}">${emiSavings >= 0 ? 'Saves ' + formatINR(emiSavings) + '/m' : '+ ' + formatINR(Math.abs(emiSavings))}</span></td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Mobile View: Parameter Cards -->
          <div class="mobile-param-cards">
            <!-- ROI Card -->
            <div class="param-card-mobile">
              <div class="param-card-title">
                <span>📈 ROI (% p.a.)</span>
                <span>${roiTag}</span>
              </div>
              <div class="param-values-row">
                <div class="param-val-box">
                  <div class="param-val-lbl">Benchmark Base</div>
                  <div class="param-val-num">${session.baseRoi.toFixed(2)}%</div>
                </div>
                <div class="param-val-box">
                  <div class="param-val-lbl">Sanctioned</div>
                  <div class="param-val-num">${session.sancRoi.toFixed(2)}%</div>
                </div>
                <div class="param-val-box" style="border: 1px solid var(--accent-primary);">
                  <div class="param-val-lbl" style="color:var(--accent-primary);">Requested</div>
                  <div class="param-val-num" style="color:var(--accent-primary);">${session.reqRoi.toFixed(2)}%</div>
                </div>
              </div>
            </div>

            <!-- PF Card -->
            <div class="param-card-mobile">
              <div class="param-card-title">
                <span>🏷️ Processing Fee (PF)</span>
                <span>${pfTag}</span>
              </div>
              <div class="param-values-row">
                <div class="param-val-box">
                  <div class="param-val-lbl">Benchmark Base</div>
                  <div class="param-val-num">${session.basePf.toFixed(2)}%</div>
                </div>
                <div class="param-val-box">
                  <div class="param-val-lbl">Sanctioned</div>
                  <div class="param-val-num">${session.sancPf.toFixed(2)}%</div>
                </div>
                <div class="param-val-box" style="border: 1px solid var(--accent-secondary);">
                  <div class="param-val-lbl" style="color:var(--accent-secondary);">Requested</div>
                  <div class="param-val-num" style="color:var(--accent-secondary);">${session.reqPf.toFixed(2)}%</div>
                </div>
              </div>
            </div>

            <!-- EMI Card -->
            <div class="param-card-mobile">
              <div class="param-card-title">
                <span>💵 Monthly EMI</span>
                <span class="tag-badge ${emiSavings >= 0 ? 'favorable' : 'cbo'}">${emiSavings >= 0 ? 'Saves ' + formatINR(emiSavings) + '/m' : '+ ' + formatINR(Math.abs(emiSavings))}</span>
              </div>
              <div class="param-values-row">
                <div class="param-val-box">
                  <div class="param-val-lbl">Sanctioned EMI</div>
                  <div class="param-val-num">${formatINR(session.sancEmi)}</div>
                </div>
                <div class="param-val-box" style="grid-column: span 2; border: 1px solid var(--accent-primary);">
                  <div class="param-val-lbl" style="color:var(--accent-primary);">Proposed EMI (${session.sancTenure}m)</div>
                  <div class="param-val-num" style="color:var(--accent-primary);">${formatINR(reqEmi)}</div>
                </div>
              </div>
            </div>
          </div>

          <div class="summary-grid">
            <div class="stat-cell">
              <div class="stat-title">Proposed EMI</div>
              <div class="stat-num" style="color:var(--accent-primary);">${formatINR(reqEmi)}</div>
              <div class="stat-sub">${session.sancTenure}m reducing</div>
            </div>
            <div class="stat-cell">
              <div class="stat-title">Monthly EMI Difference</div>
              <div class="stat-num" style="color:var(--color-green);">${formatINR(Math.max(0, emiSavings))}</div>
              <div class="stat-sub">${emiSavings > 0 ? 'Monthly customer savings' : 'Same as sanctioned'}</div>
            </div>
            <div class="stat-cell">
              <div class="stat-title">PF Upfront Difference</div>
              <div class="stat-num" style="color:var(--accent-secondary);">${formatINR(Math.max(0, pfSavings))}</div>
              <div class="stat-sub">Fee discount</div>
            </div>
            <div class="stat-cell">
              <div class="stat-title">Updated DTI Ratio</div>
              <div class="stat-num" style="color:${dtiResult.warning ? 'var(--color-amber)' : 'var(--color-green)'};">${dtiResult.updatedDti}%</div>
              <div class="stat-sub">Was ${session.currentDti}%</div>
            </div>
          </div>
          ${dtiAlertHtml}
        </div>`;

      appendBotCard({
        categoryBadge: "PRICING VERDICT",
        icon3d: "🏆",
        stepText: "STEP 5 OF 5",
        htmlContent: `${t("evalTitle")} — <strong>${escapeHtml(session.caseName)}</strong>:<br>${reportHtml}`,
        chips: [
          { label: t("btnTryRates"), icon: "✏️", primary: true, value: "re_evaluate_rates" },
          { label: t("btnNewCase"), icon: "👤", value: "new_case" }
        ],
        catMood: mood,
        delayMs: 450
      });
    }

    function reAskProposedRates() {
      session.step = STEPS.REQ_ROI;
      updateStepperUI();
      inputHint.textContent = `Enter requested ROI % (Base: ${session.baseRoi}%, Sanc: ${session.sancRoi}%)`;
      userInput.placeholder = `Benchmark base is ${session.baseRoi}%, enter requested ROI...`;

      appendBotCard({
        categoryBadge: "RATE CONCESSION",
        icon3d: "✏️",
        stepText: "STEP 4 OF 5",
        htmlContent: `Let's test another requested rate for <strong>${escapeHtml(session.caseName)}</strong>.<br>` +
          `Loan: ${formatINR(session.sancAmount)} (${session.sancTenure}m @ ${session.sancRoi}%), Base: ${session.baseRoi}% / ${session.basePf}%.<br><br>` +
          `${t("askReqRoi")}`,
        chips: [
          { label: `${session.baseRoi}% (Base Rate)`, value: String(session.baseRoi), primary: true },
          { label: `${(session.baseRoi - 1.5).toFixed(1)}% (CBO drop ≤2%)`, value: String(session.baseRoi - 1.5) },
          { label: `${(session.baseRoi - 3.0).toFixed(1)}% (COO drop ≤4%)`, value: String(session.baseRoi - 3.0) },
          { label: `14.5% (<15% CEO Floor)`, value: "14.5" }
        ],
        catMood: "curious"
      });
    }

    // Direct action handlers for follow-ups
    function handleFollowUpAction(action) {
      if (action === "re_evaluate_rates") {
        appendUserMessage("✏️ " + t("btnTryRates"));
        reAskProposedRates();
      } else if (action === "new_case" || action === "restart") {
        appendUserMessage("👤 " + t("btnNewCase"));
        restartSession();
      }
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", () => { scrollChatToBottom(); });
    }

    // Version release tag for service worker & cache purging
    const LENDY_RELEASE_BUILD = "v20261103_10";
    if (typeof window !== "undefined" && window.caches) {
      try {
        const cachedVer = localStorage.getItem("lendy_active_build");
        if (cachedVer !== LENDY_RELEASE_BUILD) {
          localStorage.setItem("lendy_active_build", LENDY_RELEASE_BUILD);
          caches.keys().then((keys) => {
            keys.forEach((key) => {
              if (key !== "lendy-pwa-v4-network-first") caches.delete(key);
            });
          });
        }
      } catch (e) {}
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (const reg of registrations) {
            reg.update();
          }
        });
        navigator.serviceWorker.register("./sw.js?v=" + LENDY_RELEASE_BUILD).then((reg) => {
          reg.addEventListener("updatefound", () => {
            const worker = reg.installing;
            if (worker) {
              worker.addEventListener("statechange", () => {
                if (worker.state === "installed" && navigator.serviceWorker.controller) {
                  window.location.reload();
                }
              });
            }
          });
        }).catch(() => {});
      });
    }

    function initLendyApp() {
      const savedTheme = localStorage.getItem("lendy_theme");
      if (savedTheme) {
        document.documentElement.setAttribute("data-theme", savedTheme);
        const match = WALLPAPER_THEMES.find(t => t.id === savedTheme);
        if (match) {
          const themeEmojiEl = document.getElementById("themeEmoji");
          if (themeEmojiEl) themeEmojiEl.textContent = match.emoji;
        }
      }
      startConversation();
      startAutonomousCatLifeCycle();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initLendyApp);
    } else {
      initLendyApp();
    }
  </script>
</body>
</html>
