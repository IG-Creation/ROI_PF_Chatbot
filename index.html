<!DOCTYPE html>
<html lang="en" data-theme="cyber-city">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Lendy 🐱 — 3D Smart Loan Pricing & Deviation Assistant</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Lendy is an executive 3D loan pricing and deviation evaluation chatbot for credit managers and officers.">

  <style>
    /* ==========================================================================
       SMARTPHONE WALLPAPER THEMES & COLOR SYSTEM
       ========================================================================== */
    :root, [data-theme="cyber-city"] {
      --wallpaper-bg: radial-gradient(circle at 50% 10%, #1e113a 0%, #0d091a 45%, #05040a 100%);
      --wallpaper-overlay: 
        radial-gradient(circle at 85% 20%, rgba(236, 72, 153, 0.25) 0%, transparent 40%),
        radial-gradient(circle at 15% 75%, rgba(6, 182, 212, 0.25) 0%, transparent 45%),
        linear-gradient(to bottom, rgba(5, 4, 10, 0.4) 0%, rgba(5, 4, 10, 0.85) 100%);
      --panel-bg: rgba(18, 14, 30, 0.82);
      --card-bg: rgba(30, 22, 50, 0.72);
      --card-hover: rgba(48, 36, 78, 0.85);
      --border-line: rgba(255, 255, 255, 0.12);
      --border-glow: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --text-subtle: #94a3b8;
      --accent-primary: #38bdf8;
      --accent-secondary: #c084fc;
      --accent-hot: #f43f5e;
      --accent-emerald: #10b981;
      --color-green: #34d399;
      --color-green-bg: rgba(52, 211, 153, 0.2);
      --color-blue: #60a5fa;
      --color-blue-bg: rgba(96, 165, 250, 0.2);
      --color-amber: #fbbf24;
      --color-amber-bg: rgba(251, 191, 36, 0.2);
      --color-red: #f87171;
      --color-red-bg: rgba(248, 113, 113, 0.22);
      --btn-grad: linear-gradient(135deg, #06b6d4, #8b5cf6);
      --bubble-user-grad: linear-gradient(135deg, #6366f1, #a855f7);
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif;
    }

    [data-theme="cosmic-nebula"] {
      --wallpaper-bg: radial-gradient(circle at 50% 20%, #2e1065 0%, #0f0728 50%, #030014 100%);
      --wallpaper-overlay: 
        radial-gradient(circle at 20% 30%, rgba(168, 85, 247, 0.3) 0%, transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.28) 0%, transparent 50%),
        linear-gradient(to bottom, rgba(3, 0, 20, 0.35) 0%, rgba(3, 0, 20, 0.85) 100%);
      --panel-bg: rgba(20, 10, 42, 0.85);
      --card-bg: rgba(38, 20, 75, 0.72);
      --card-hover: rgba(58, 30, 110, 0.85);
      --border-line: rgba(255, 255, 255, 0.14);
      --border-glow: #c084fc;
      --text-main: #fdf4ff;
      --text-muted: #e9d5ff;
      --text-subtle: #a855f7;
      --accent-primary: #c084fc;
      --accent-secondary: #60a5fa;
      --accent-hot: #f472b6;
      --accent-emerald: #34d399;
      --color-green: #34d399;
      --color-green-bg: rgba(52, 211, 153, 0.2);
      --color-blue: #60a5fa;
      --color-blue-bg: rgba(96, 165, 250, 0.2);
      --color-amber: #fbbf24;
      --color-amber-bg: rgba(251, 191, 36, 0.2);
      --color-red: #f87171;
      --color-red-bg: rgba(248, 113, 113, 0.22);
      --btn-grad: linear-gradient(135deg, #a855f7, #ec4899);
      --bubble-user-grad: linear-gradient(135deg, #7c3aed, #db2777);
    }

    [data-theme="sunset-gold"] {
      --wallpaper-bg: radial-gradient(circle at 50% 0%, #431407 0%, #1c0a06 45%, #0a0302 100%);
      --wallpaper-overlay: 
        radial-gradient(circle at 80% 25%, rgba(245, 158, 11, 0.3) 0%, transparent 45%),
        radial-gradient(circle at 20% 70%, rgba(225, 29, 72, 0.25) 0%, transparent 50%),
        linear-gradient(to bottom, rgba(10, 3, 2, 0.35) 0%, rgba(10, 3, 2, 0.85) 100%);
      --panel-bg: rgba(32, 12, 8, 0.85);
      --card-bg: rgba(56, 22, 14, 0.72);
      --card-hover: rgba(84, 34, 22, 0.85);
      --border-line: rgba(255, 255, 255, 0.14);
      --border-glow: #f59e0b;
      --text-main: #fffbeb;
      --text-muted: #fde68a;
      --text-subtle: #b45309;
      --accent-primary: #f59e0b;
      --accent-secondary: #f43f5e;
      --accent-hot: #f97316;
      --accent-emerald: #10b981;
      --color-green: #34d399;
      --color-green-bg: rgba(52, 211, 153, 0.2);
      --color-blue: #38bdf8;
      --color-blue-bg: rgba(56, 189, 248, 0.2);
      --color-amber: #fbbf24;
      --color-amber-bg: rgba(251, 191, 36, 0.2);
      --color-red: #f87171;
      --color-red-bg: rgba(248, 113, 113, 0.22);
      --btn-grad: linear-gradient(135deg, #f59e0b, #e11d48);
      --bubble-user-grad: linear-gradient(135deg, #ea580c, #be123c);
    }

    [data-theme="emerald-aurora"] {
      --wallpaper-bg: radial-gradient(circle at 50% 10%, #064e3b 0%, #022c22 45%, #01140e 100%);
      --wallpaper-overlay: 
        radial-gradient(circle at 20% 30%, rgba(52, 211, 153, 0.28) 0%, transparent 45%),
        radial-gradient(circle at 80% 70%, rgba(6, 182, 212, 0.25) 0%, transparent 45%),
        linear-gradient(to bottom, rgba(1, 20, 14, 0.35) 0%, rgba(1, 20, 14, 0.85) 100%);
      --panel-bg: rgba(8, 38, 30, 0.85);
      --card-bg: rgba(14, 58, 46, 0.72);
      --card-hover: rgba(22, 88, 70, 0.85);
      --border-line: rgba(255, 255, 255, 0.13);
      --border-glow: #10b981;
      --text-main: #f0fdf4;
      --text-muted: #bbf7d0;
      --text-subtle: #059669;
      --accent-primary: #10b981;
      --accent-secondary: #06b6d4;
      --accent-hot: #f43f5e;
      --accent-emerald: #34d399;
      --color-green: #34d399;
      --color-green-bg: rgba(52, 211, 153, 0.2);
      --color-blue: #38bdf8;
      --color-blue-bg: rgba(56, 189, 248, 0.2);
      --color-amber: #fbbf24;
      --color-amber-bg: rgba(251, 191, 36, 0.2);
      --color-red: #f87171;
      --color-red-bg: rgba(248, 113, 113, 0.22);
      --btn-grad: linear-gradient(135deg, #10b981, #06b6d4);
      --bubble-user-grad: linear-gradient(135deg, #059669, #0284c7);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--wallpaper-bg);
      color: var(--text-main);
      font-family: var(--font-stack);
      font-size: 15px;
      line-height: 1.5;
      position: relative;
    }

    body {
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Smartphone Wallpaper Overlay */
    .wallpaper-art {
      position: fixed;
      inset: 0;
      background: var(--wallpaper-overlay);
      pointer-events: none;
      z-index: 0;
    }

    /* Ambient Floating Bokeh Lights */
    .bokeh-light {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      pointer-events: none;
      opacity: 0.6;
      animation: float-bokeh 18s infinite alternate ease-in-out;
    }

    .b1 { width: 320px; height: 320px; background: var(--accent-primary); top: -40px; left: -30px; }
    .b2 { width: 380px; height: 380px; background: var(--accent-secondary); bottom: 15%; right: -50px; animation-duration: 22s; }

    @keyframes float-bokeh {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(40px) scale(1.15); }
    }

    /* ==========================================================================
       HEADER & NAVIGATION BAR
       ========================================================================== */
    .app-header {
      height: 72px;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      z-index: 30;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-titles h1 {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-titles p {
      font-size: 11.5px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Language Switcher Dropdown Button */
    .lang-selector-btn, .theme-selector-btn, .reset-btn {
      min-height: 38px;
      padding: 0 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-line);
      border-radius: 9999px;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    .lang-selector-btn:hover, .theme-selector-btn:hover, .reset-btn:hover {
      background: var(--card-hover);
      border-color: var(--border-glow);
      transform: translateY(-1px);
    }

    /* ==========================================================================
       CHAT CONTAINER STREAM
       ========================================================================== */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px 16px 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
      position: relative;
      z-index: 10;
    }

    .message-row {
      display: flex;
      gap: 10px;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      opacity: 0;
      transform: translateY(10px);
      animation: msg-enter 0.28s ease-out forwards;
    }

    @keyframes msg-enter {
      to { opacity: 1; transform: translateY(0); }
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .avatar-badge {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--btn-grad);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(6, 182, 212, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .message-bubble {
      padding: 14px 18px;
      border-radius: 16px;
      line-height: 1.55;
      font-size: 14.5px;
      position: relative;
      word-break: break-word;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .message-row.bot .message-bubble {
      background: var(--card-bg);
      border: 1px solid var(--border-line);
      color: var(--text-main);
      border-top-left-radius: 4px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .message-row.user .message-bubble {
      background: var(--bubble-user-grad);
      color: #ffffff;
      border-top-right-radius: 4px;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-weight: 500;
    }

    /* Typing Dots */
    .typing-dots {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 2px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background: var(--accent-primary);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--accent-primary);
      animation: dot-glow 1.4s infinite ease-in-out both;
    }

    .pulse-dot:nth-child(1) { animation-delay: -0.32s; }
    .pulse-dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes dot-glow {
      0%, 80%, 100% { transform: scale(0.4); opacity: 0.3; }
      40% { transform: scale(1.1); opacity: 1; }
    }

    /* ==========================================================================
       CARDS, STATUS & TABLES
       ========================================================================== */
    .status-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-line);
      border-radius: 16px;
      overflow: hidden;
      margin-top: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }

    .status-card-header {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 15.5px;
      border-bottom: 1px solid var(--border-line);
    }

    .status-card-header.green {
      background: var(--color-green-bg);
      color: var(--color-green);
      border-bottom-color: rgba(52, 211, 153, 0.4);
      box-shadow: inset 0 0 20px rgba(52, 211, 153, 0.1);
    }

    .status-card-header.blue {
      background: var(--color-blue-bg);
      color: var(--color-blue);
      border-bottom-color: rgba(96, 165, 250, 0.4);
      box-shadow: inset 0 0 20px rgba(96, 165, 250, 0.1);
    }

    .status-card-header.amber {
      background: var(--color-amber-bg);
      color: var(--color-amber);
      border-bottom-color: rgba(251, 191, 36, 0.4);
      box-shadow: inset 0 0 20px rgba(251, 191, 36, 0.1);
    }

    .status-card-header.red {
      background: var(--color-red-bg);
      color: var(--color-red);
      border-bottom-color: rgba(248, 113, 113, 0.4);
      box-shadow: inset 0 0 25px rgba(248, 113, 113, 0.2);
    }

    .status-card-body {
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.02);
      font-size: 13.5px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-line);
      line-height: 1.6;
    }

    .status-card-body strong {
      color: var(--text-main);
    }

    .floor-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 800;
      background: var(--color-red-bg);
      color: var(--color-red);
      border: 1px solid rgba(248, 113, 113, 0.4);
      margin-bottom: 8px;
    }

    .comparison-table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    .comparison-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }

    .comparison-table th, 
    .comparison-table td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border-line);
    }

    .comparison-table th {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.05em;
    }

    .comparison-table td:last-child,
    .comparison-table th:last-child {
      text-align: right;
    }

    .tag-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
    }

    .tag-badge.favorable { background: var(--color-green-bg); color: var(--color-green); border: 1px solid rgba(52, 211, 153, 0.3); }
    .tag-badge.cbo { background: var(--color-blue-bg); color: var(--color-blue); border: 1px solid rgba(96, 165, 250, 0.3); }
    .tag-badge.coo { background: var(--color-amber-bg); color: var(--color-amber); border: 1px solid rgba(251, 191, 36, 0.3); }
    .tag-badge.ceo { background: var(--color-red-bg); color: var(--color-red); border: 1px solid rgba(248, 113, 113, 0.3); }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 14px;
      background: rgba(0, 0, 0, 0.2);
    }

    @media (min-width: 600px) {
      .summary-grid { grid-template-columns: repeat(4, 1fr); }
    }

    .stat-cell {
      background: var(--card-bg);
      border: 1px solid var(--border-line);
      border-radius: 12px;
      padding: 10px 14px;
    }

    .stat-title {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
    }

    .stat-num {
      font-size: 16px;
      font-weight: 800;
      margin: 3px 0;
      color: var(--text-main);
    }

    .stat-sub {
      font-size: 11px;
      color: var(--text-subtle);
    }

    .alert-banner {
      margin: 12px 14px;
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--color-amber-bg);
      border: 1px solid rgba(251, 191, 36, 0.4);
      color: #fef3c7;
      font-size: 13px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(251, 191, 36, 0.15);
    }

    /* ==========================================================================
       TAPPABLE QUICK-REPLY CHIPS
       ========================================================================== */
    .chips-area {
      padding: 8px 16px 12px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-start;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      z-index: 20;
    }

    .action-chip {
      min-height: 44px;
      padding: 10px 16px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-line);
      border-radius: 9999px;
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .action-chip:hover {
      background: var(--card-hover);
      border-color: var(--border-glow);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(6, 182, 212, 0.3);
    }

    .action-chip:active {
      transform: scale(0.96);
    }

    .action-chip.primary-glow {
      background: var(--btn-grad);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.35);
      box-shadow: 0 4px 18px rgba(139, 92, 246, 0.4);
    }

    /* ==========================================================================
       TALKING TOM STYLE 3D STANDING REAL CAT COMPANION NEAR SEND BUTTON
       ========================================================================== */
    .input-bar-container {
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-line);
      padding: 10px 16px;
      flex-shrink: 0;
      z-index: 30;
      position: relative;
    }

    .input-row-wrapper {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 12px;
      position: relative;
    }

    /* Standing 3D Real Cat Container */
    .cat-tom-stage {
      position: relative;
      width: 72px;
      height: 94px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      cursor: pointer;
      perspective: 800px;
      flex-shrink: 0;
      margin-bottom: 2px;
    }

    .cat-tom-body-3d {
      width: 68px;
      height: 90px;
      transform-style: preserve-3d;
      transition: transform 0.2s ease-out;
      transform-origin: center bottom;
      position: relative;
    }

    /* Breathing & Standing Idling Animation */
    @keyframes tom-breathe {
      0%, 100% { transform: translateY(0) scaleY(1); }
      50% { transform: translateY(-2px) scaleY(1.02); }
    }
    .tom-standing {
      animation: tom-breathe 2.4s infinite ease-in-out;
    }

    /* Laughing / Giggling 3D Animation like Talking Tom */
    @keyframes tom-laugh {
      0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
      20% { transform: translateY(-5px) rotate(-3deg) scale(1.06); }
      40% { transform: translateY(0) rotate(3deg) scale(1.02); }
      60% { transform: translateY(-6px) rotate(-2deg) scale(1.08); }
      80% { transform: translateY(-2px) rotate(2deg) scale(1.04); }
    }
    .tom-laughing {
      animation: tom-laugh 0.7s infinite ease-in-out !important;
    }

    /* Tail Swaying Animation */
    @keyframes tom-tail-sway {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(24deg) skewX(10deg); }
    }
    .tom-tail {
      transform-origin: 22px 70px;
      animation: tom-tail-sway 1.8s infinite ease-in-out;
    }

    /* Ear Twitching Animation */
    @keyframes tom-ear-wiggle {
      0%, 88%, 100% { transform: rotate(0deg); }
      92% { transform: rotate(-5deg); }
      96% { transform: rotate(4deg); }
    }
    .tom-ears {
      transform-origin: 34px 18px;
      animation: tom-ear-wiggle 4.5s infinite;
    }

    /* Talking mouth jaw animation */
    @keyframes tom-jaw-talk {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(1.9); }
    }
    .tom-talking .tom-jaw {
      animation: tom-jaw-talk 0.22s infinite alternate ease-in-out;
      transform-origin: center;
    }

    /* 3D Cat Speech Bubble */
    .cat-speech-bubble {
      position: absolute;
      bottom: 96px;
      right: -10px;
      background: var(--card-bg);
      border: 1px solid var(--border-glow);
      padding: 6px 12px;
      border-radius: 14px;
      font-size: 12.5px;
      font-weight: 800;
      color: var(--accent-primary);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transform: translateY(8px) scale(0.85);
      transition: all 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
      z-index: 50;
    }

    .cat-speech-bubble.active {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .cat-speech-bubble::after {
      content: "";
      position: absolute;
      bottom: -6px;
      right: 32px;
      border-width: 6px 6px 0;
      border-style: solid;
      border-color: var(--border-glow) transparent transparent;
    }

    /* Floor Shadow Under 3D Standing Cat */
    .cat-floor-shadow {
      width: 48px;
      height: 9px;
      background: radial-gradient(ellipse, rgba(0, 0, 0, 0.6) 0%, transparent 70%);
      border-radius: 50%;
      margin-top: -3px;
    }

    .input-field-wrapper {
      flex: 1;
      position: relative;
    }

    .chat-input {
      width: 100%;
      min-height: 48px;
      background: var(--card-bg);
      border: 1px solid var(--border-line);
      border-radius: 9999px;
      padding: 12px 20px;
      color: var(--text-main);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .chat-input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.3);
    }

    .chat-input::placeholder {
      color: var(--text-subtle);
    }

    .send-action-btn {
      min-width: 48px;
      min-height: 48px;
      width: 48px;
      height: 48px;
      background: var(--btn-grad);
      color: #ffffff;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
      box-shadow: 0 4px 18px rgba(6, 182, 212, 0.4);
    }

    .send-action-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 24px rgba(139, 92, 246, 0.5);
    }

    .send-action-btn:active {
      transform: scale(0.94);
    }

    .send-action-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .send-action-btn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
      margin-left: 2px;
    }

    .input-hint-line {
      font-size: 11.5px;
      color: var(--text-subtle);
      margin-top: 5px;
      text-align: center;
    }
  </style>
</head>

    function lookupBaseRates(product, ticketSize, incomeProgram, propertyType, bureau) {
      const match = CONFIG.MATRIX.find(row => 
        row.product === product &&
        row.ticket === ticketSize &&
        row.income === incomeProgram &&
        row.property === propertyType &&
        row.bureau === bureau
      );
      if (match) return { baseRoi: match.baseRoi, basePf: match.basePf };
      return null;
    }

    function getApproverForDeviation(deviation, bandType) {
      const eps = CONFIG.ROUNDING_TOLERANCE;
      if (deviation <= eps) return "NONE";
      const bands = CONFIG.BANDS[bandType];
      for (let i = 0; i < bands.length; i++) {
        if (deviation <= bands[i].max + eps) return bands[i].approver;
      }
      return "CEO";
    }

      let pfApprover = getApproverForDeviation(pfDeviation, "PF");

      // Mandatory Absolute Policy Floors
      const roiFloorBreached = reqRoi < (CONFIG.ROI_FLOOR_PERCENT - eps);
      const pfFloorBreached = reqPf < (CONFIG.PF_FLOOR_PERCENT - eps);

      if (roiFloorBreached) roiApprover = "CEO";
      if (pfFloorBreached) pfApprover = "CEO";

      const levelRoi = CONFIG.APPROVERS[roiApprover].level;
      const levelPf = CONFIG.APPROVERS[pfApprover].level;
      const finalKey = levelRoi >= levelPf ? roiApprover : pfApprover;
      const approverInfo = CONFIG.APPROVERS[finalKey];

      let explanation = "";
      const reasons = [];

      if (roiFloorBreached) {
        reasons.push(`⚠️ Requested ROI (${reqRoi.toFixed(2)}%) is below the mandatory 15.00% floor, mandating CEO Approval`);
      } else if (roiApprover !== "NONE") {
        reasons.push(`ROI discount of ${roiDeviation.toFixed(2)}% requires ${CONFIG.APPROVERS[roiApprover].name}`);
      }

      if (pfFloorBreached) {
        reasons.push(`⚠️ Requested PF (${reqPf.toFixed(2)}%) is below the mandatory 1.50% floor, mandating CEO Approval`);
      } else if (pfApprover !== "NONE") {
        reasons.push(`PF waiver/discount of ${pfDeviation.toFixed(2)}% requires ${CONFIG.APPROVERS[pfApprover].name}`);
      }

      if (reasons.length === 0) {
        explanation = "Requested rates match or exceed benchmark requirements. Standard processing without deviation.";
      } else {
        explanation = reasons.join(" • ") + `. Final authority governed by: <strong>${approverInfo.name} (${approverInfo.title})</strong>.`;
      }

      return {
        roiDeviation, pfDeviation,
        roiApprover, pfApprover,
        roiFloorBreached, pfFloorBreached,
        finalApproverKey: finalKey,
        finalApproverName: approverInfo.name,
        color: approverInfo.color,
        requiresApproval: finalKey !== "NONE",
        explanation
      };
    }

    function calculateReducingEMI(principal, annualRatePct, tenureMonths) {
      if (tenureMonths <= 0) return 0;
      if (annualRatePct <= 0) return principal / tenureMonths;
      const r = annualRatePct / 12.0 / 100.0;
      const factor = Math.pow(1.0 + r, tenureMonths);
      return (principal * r * factor) / (factor - 1.0);
    }

    function calculateDTI(existingEmis, newEmi, monthlyIncome) {
      if (monthlyIncome <= 0) return { currentDti: 0, updatedDti: 0, warning: false };
      const currentDti = (existingEmis / monthlyIncome) * 100.0;
      const updatedDti = ((existingEmis + newEmi) / monthlyIncome) * 100.0;
      const warning = updatedDti > CONFIG.DTI_LIMIT_PERCENT;
      return {
        currentDti: parseFloat(currentDti.toFixed(2)),
        updatedDti: parseFloat(updatedDti.toFixed(2)),
        warning
      };
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function formatINR(number) {
      if (isNaN(number)) return "₹0";
      return "₹" + Math.round(number).toLocaleString("en-IN");
    }

    function parseLoanAmount(text) {
      if (!text) return null;
      let clean = text.toLowerCase().trim().replace(/,/g, "").replace(/₹/g, "").replace(/rs\.?/g, "");
      if (clean.includes("cr") || clean.includes("crore")) {
        const num = parseFloat(clean.replace(/crores?|cr/g, "").trim());
        return isNaN(num) || num <= 0 ? null : num * 10000000;
      }
      if (clean.includes("lakh") || clean.includes("lac")) {
        const num = parseFloat(clean.replace(/lakhs?|lacs?|lac/g, "").trim());
        return isNaN(num) || num <= 0 ? null : num * 100000;
      }
      if (clean.includes("k")) {
        const num = parseFloat(clean.replace(/k/g, "").trim());
        return isNaN(num) || num <= 0 ? null : num * 1000;
      }
      const num = parseFloat(clean);
      return isNaN(num) || num <= 0 ? null : num;
    }

    function parseTenure(text) {
      if (!text) return null;
      let clean = text.toLowerCase().trim().replace(/,/g, "");
      if (clean.includes("year") || clean.includes("yr") || clean.includes("y")) {
        const num = parseFloat(clean.replace(/years?|yrs?|y/g, "").trim());
        if (isNaN(num) || num <= 0) return null;
        const months = Math.round(num * 12);
        return months >= 3 && months <= 360 ? months : null;
      }
      if (clean.includes("month") || clean.includes("m")) {
        const num = parseFloat(clean.replace(/months?|m/g, "").trim());
        if (isNaN(num) || num <= 0) return null;
        return num >= 3 && num <= 360 ? Math.round(num) : null;
      }
      const num = parseFloat(clean);
      if (isNaN(num) || num < 3 || num > 360) return null;
      return Math.round(num);
    }

    function parseNumber(text) {
      if (!text) return null;
      let clean = text.toLowerCase().trim().replace(/,/g, "").replace(/₹/g, "").replace(/rs\.?/g, "");
      if (["nil", "none", "zero", "0", "na", "no"].includes(clean)) return 0.0;
      return parseLoanAmount(clean);
    }

            return;
          }
          session.sancRoi = parsedRoi;
          session.step = STEPS.SANC_PF;
          inputHint.textContent = "Enter sanctioned PF % (e.g. 2%, 3)";
          userInput.placeholder = "e.g. 2%, 3%...";
          appendBotMessage(
            `Sanctioned ROI: <strong>${session.sancRoi.toFixed(2)}% p.a.</strong> 📊<br><br>${t("askSancPf")}`,
            [
              { label: "2.0%", value: "2.0" },
              { label: "3.0%", value: "3.0", primary: true }
            ], "talking"
          );
          break;

        case STEPS.SANC_PF:
          const parsedPf = parseFloat(clean.replace(/%/g, ""));
          if (isNaN(parsedPf) || parsedPf < 0 || parsedPf > 15) {
            appendBotMessage(`Please enter a valid Processing Fee between 0% and 15%:`, [{ label: "2.0%", value: "2.0" }, { label: "3.0%", value: "3.0" }], "worried");
            return;
          }
          session.sancPf = parsedPf;
          session.step = STEPS.INCOME_FREQ;
          inputHint.textContent = "Select Monthly or Annual income";
          userInput.placeholder = "Select income frequency...";
          appendBotMessage(
            `Sanctioned PF: <strong>${session.sancPf.toFixed(2)}%</strong>. 💼<br><br>${t("askIncomeFreq")}`,
            [{ label: t("monthly"), value: "Monthly", icon: "📅", primary: true }, { label: t("annual"), value: "Annual", icon: "📊" }], "talking"
          );
          break;

        case STEPS.INCOME_FREQ:
          const freq = clean.toLowerCase().includes("ann") || clean === t("annual") ? "Annual" : "Monthly";
          session.incomeFreq = freq;
          session.step = STEPS.INCOME_AMOUNT;
          inputHint.textContent = `Enter ${freq.toLowerCase()} income amount`;
          userInput.placeholder = freq === "Annual" ? "e.g. 12 lakh, 12,00,000..." : "e.g. 80,000, 1 lakh...";
          appendBotMessage(
            `${t("askIncomeAmount")} <strong>${freq} Income</strong>:`,
            freq === "Annual" ? [
              { label: "₹6 Lakhs", value: "600000" },
              { label: "₹12 Lakhs", value: "1200000", primary: true },
              { label: "₹24 Lakhs", value: "2400000" }
            ] : [
              { label: "₹50,000", value: "50000" },
              { label: "₹80,000", value: "80000", primary: true },
              { label: "₹1,50,000", value: "150000" }
            ], "talking"
          );
          break;

        case STEPS.INCOME_AMOUNT:
          const parsedInc = parseNumber(clean);
          if (!parsedInc || parsedInc <= 0) {
            appendBotMessage(`Please enter a valid positive income (e.g. <em>"80,000"</em> or <em>"12 lakh"</em>):`, [], "worried");
            return;
          }
          session.monthlyIncome = session.incomeFreq === "Annual" ? parsedInc / 12.0 : parsedInc;
          session.step = STEPS.EXISTING_EMIS;
          inputHint.textContent = "Enter total existing monthly obligations (0 if none)";
          userInput.placeholder = "e.g. 20,000 or 0...";
          appendBotMessage(
            `Monthly Income: <strong>${formatINR(session.monthlyIncome)}/month</strong>. 💼<br><br>${t("askExistingEmis")}`,
            [
              { label: "0 (None)", value: "0", primary: true },
              { label: "₹10,000", value: "10000" },
              { label: "₹20,000", value: "20000" },
              { label: "₹35,000", value: "35000" }
            ], "talking"
          );
          break;

        case STEPS.EXISTING_EMIS:
          const parsedEmis = parseNumber(clean);
          if (parsedEmis === null || parsedEmis < 0) {
            appendBotMessage(`Please enter 0 or positive existing obligations:`, [{ label: "0", value: "0" }], "worried");
            return;
          }
          session.existingEmis = parsedEmis;

          // Compute Current Sanctioned Status
          session.sancEmi = calculateReducingEMI(session.sancAmount, session.sancRoi, session.sancTenure);
          const currentDtiObj = calculateDTI(session.existingEmis, session.sancEmi, session.monthlyIncome);
          session.currentDti = currentDtiObj.updatedDti;

          // Lookup Policy Matrix Benchmark
          const baseRates = lookupBaseRates(session.product, session.ticketSize, session.incomeProgram, session.propertyType, session.bureau);
          if (baseRates) {
            session.baseRoi = baseRates.baseRoi;
            session.basePf = baseRates.basePf;
          } else {
            session.baseRoi = session.sancRoi;
            session.basePf = session.sancPf;
          }

          session.step = STEPS.REQ_ROI;
          inputHint.textContent = "Enter requested ROI % p.a. (e.g. 16.5%)";
          userInput.placeholder = `Policy base is ${session.baseRoi}%, enter requested ROI...`;

          // Midway Sanctioned Status Milestone Card
          const sancCardHtml = `
            <div class="status-card">
              <div class="status-card-header blue">
                <span>${t("sancStatusTitle")}</span>
              </div>
              <div class="summary-grid">
                <div class="stat-cell">
                  <div class="stat-title">${t("sancEmiLabel")}</div>
                  <div class="stat-num" style="color:var(--accent-primary);">${formatINR(session.sancEmi)}</div>
                  <div class="stat-sub">${session.sancTenure}m @ ${session.sancRoi}%</div>
                </div>
                <div class="stat-cell">
                  <div class="stat-title">${t("currentDtiLabel")}</div>
                  <div class="stat-num" style="color:${session.currentDti > 50 ? 'var(--color-amber)' : 'var(--color-green)'};">${session.currentDti}%</div>
                  <div class="stat-sub">Income: ${formatINR(session.monthlyIncome)}/m</div>
                </div>
                <div class="stat-cell">
                  <div class="stat-title">${t("baseRoiLabel")}</div>
                  <div class="stat-num" style="color:var(--accent-secondary);">${session.baseRoi.toFixed(2)}%</div>
                  <div class="stat-sub">56-Row Matrix Policy</div>
                </div>
                <div class="stat-cell">
                  <div class="stat-title">${t("basePfLabel")}</div>
                  <div class="stat-num" style="color:var(--accent-hot);">${session.basePf.toFixed(2)}%</div>
                  <div class="stat-sub">Benchmark Fee</div>
                </div>
              </div>
            </div>`;

          appendBotMessage(
            `${sancCardHtml}<br>${t("floorWarningRoi")}<br><br>${t("askReqRoi")}`,
            [
              { label: `${session.baseRoi}% (Policy Base)`, value: String(session.baseRoi), primary: true },
              { label: `${(session.baseRoi - 1.5).toFixed(1)}% (CBO band)`, value: String(session.baseRoi - 1.5) },
              { label: `${(session.baseRoi - 3.0).toFixed(1)}% (COO band)`, value: String(session.baseRoi - 3.0) },
              { label: `14.5% (<15% CEO Floor)`, value: "14.5" }
            ], "surprised"
          );
          break;

        case STEPS.REQ_ROI:
          const numReqRoi = parseFloat(clean.replace(/%/g, ""));
          if (isNaN(numReqRoi) || numReqRoi <= 0 || numReqRoi > 60) {
            appendBotMessage(`Please enter a valid requested ROI (0 - 60%):`, [{ label: `${session.baseRoi}%`, value: String(session.baseRoi) }], "worried");
            return;
          }
          session.reqRoi = numReqRoi;
          session.step = STEPS.REQ_PF;
          inputHint.textContent = "Enter requested PF % (e.g. 1.8%, 1.2)";
          userInput.placeholder = `Policy base is ${session.basePf}%, enter requested PF...`;
          appendBotMessage(
            `Requested ROI: <strong>${session.reqRoi.toFixed(2)}% p.a.</strong><br>${t("floorWarningPf")}<br><br>${t("askReqPf")}`,
            [
              { label: `${session.basePf}% (Full PF)`, value: String(session.basePf), primary: true },
              { label: `1.8% (CBO band)`, value: "1.8" },
              { label: `1.5% (COO band)`, value: "1.5" },
              { label: `1.2% (<1.5% CEO Floor)`, value: "1.2" }
            ], "talking"
          );
          break;

        case STEPS.REQ_PF:
          const numReqPf = parseFloat(clean.replace(/%/g, ""));
          if (isNaN(numReqPf) || numReqPf < 0 || numReqPf > 15) {
            appendBotMessage(`Please enter a valid Processing Fee (0 - 15%):`, [{ label: `${session.basePf}%`, value: String(session.basePf) }], "worried");
            return;
          }
          session.reqPf = numReqPf;
          session.step = STEPS.COMPLETED;
          inputHint.textContent = "Review results or evaluate another rate";
          userInput.placeholder = "Click 'Try different ROI/PF' or 'New case'";
          renderFinalExecutiveReport();
          break;

        case STEPS.COMPLETED:
          if (clean.toLowerCase().includes("try") || clean.toLowerCase().includes("different")) {
            reAskProposedRates();
          } else if (clean.toLowerCase().includes("new")) {
            restartSession();
          } else {
            appendBotMessage(`Would you like to test another requested rate or evaluate a new proposal?`,
              [{ label: t("btnTryRates"), icon: "✏️", primary: true }, { label: t("btnNewCase"), icon: "👤" }], "idle"
            );
          }
          break;
      }
    }

    /* ==========================================================================
       FINAL COMPARATIVE EXECUTIVE EVALUATION & GOVERNANCE REPORT
       ========================================================================== */
    function renderFinalExecutiveReport() {
      const approval = determineFinalApproval(session.baseRoi, session.reqRoi, session.basePf, session.reqPf);
      const reqEmi = calculateReducingEMI(session.sancAmount, session.reqRoi, session.sancTenure);
      const emiSavings = session.sancEmi - reqEmi;

      const sancPfAmount = (session.sancAmount * session.sancPf) / 100.0;
      const reqPfAmount = (session.sancAmount * session.reqPf) / 100.0;
      const pfSavings = sancPfAmount - reqPfAmount;

      const dtiResult = calculateDTI(session.existingEmis, reqEmi, session.monthlyIncome);

      // Cat Mood
      let mood = "celebrating";
      if (approval.finalApproverKey === "CBO") mood = "happy";
      else if (approval.finalApproverKey === "COO") mood = "surprised";
      else if (approval.finalApproverKey === "CEO") mood = "worried";

      function formatTag(dev, isFloor, reqVal, floorVal, approver) {
        if (isFloor) return `<span class="tag-badge ceo">⚠️ &lt;${floorVal}% Floor (CEO)</span>`;
        if (dev <= 0) return `<span class="tag-badge favorable">No Deviation (0.00%)</span>`;
        return `<span class="tag-badge ${approver.toLowerCase()}">-${dev.toFixed(2)}% (${approver})</span>`;
      }

      const roiTag = formatTag(approval.roiDeviation, approval.roiFloorBreached, session.reqRoi, CONFIG.ROI_FLOOR_PERCENT, approval.roiApprover);
      const pfTag = formatTag(approval.pfDeviation, approval.pfFloorBreached, session.reqPf, CONFIG.PF_FLOOR_PERCENT, approval.pfApprover);

      const bannerTitle = approval.finalApproverKey === "NONE" 
        ? `✅ Standard Terms — No Authority Escalation Required`
        : `🛡️ Deviation Approval Required: ${approval.finalApproverName}`;

      const floorAlertHtml = (approval.roiFloorBreached || approval.pfFloorBreached) ? `
        <div style="margin-bottom:8px;">
          <span class="floor-badge">${t("floorAlert")}</span>
        </div>` : '';

      const dtiAlertHtml = dtiResult.warning ? `
        <div class="alert-banner">
          <span style="font-size:20px;">⚠️</span>
          <div>
            <strong>${t("dtiAlertTitle")}:</strong> Proposed DTI of ${dtiResult.updatedDti}% 
            exceeds our internal benchmark of ${CONFIG.DTI_LIMIT_PERCENT}%. Senior credit risk review applies.
          </div>
        </div>` : '';

      const reportHtml = `
        <div class="status-card">
          <div class="status-card-header ${approval.color}">
            <span>${bannerTitle}</span>
          </div>
          <div class="status-card-body">
            ${floorAlertHtml}
            ${approval.explanation}
          </div>
          <div class="comparison-table-wrapper">
            <table class="comparison-table">
              <thead>
                <tr>
                  <th>${t("tableHeader")[0]}</th>
                  <th>${t("tableHeader")[1]}</th>
                  <th>${t("tableHeader")[2]}</th>
                  <th>${t("tableHeader")[3]}</th>
                  <th>${t("tableHeader")[4]}</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td><strong>ROI (% p.a.)</strong></td>
                  <td>${session.baseRoi.toFixed(2)}%</td>
                  <td>${session.sancRoi.toFixed(2)}%</td>
                  <td><strong>${session.reqRoi.toFixed(2)}%</strong></td>
                  <td>${roiTag}</td>
                </tr>
                <tr>
                  <td><strong>Processing Fee</strong></td>
                  <td>${session.basePf.toFixed(2)}%</td>
                  <td>${session.sancPf.toFixed(2)}% (${formatINR(sancPfAmount)})</td>
                  <td><strong>${session.reqPf.toFixed(2)}% (${formatINR(reqPfAmount)})</strong></td>
                  <td>${pfTag}</td>
                </tr>
                <tr>
                  <td><strong>Monthly EMI</strong></td>
                  <td>—</td>
                  <td>${formatINR(session.sancEmi)}</td>
                  <td><strong>${formatINR(reqEmi)}</strong></td>
                  <td><span class="tag-badge ${emiSavings >= 0 ? 'favorable' : 'cbo'}">${emiSavings >= 0 ? 'Saves ' + formatINR(emiSavings) + '/m' : '+ ' + formatINR(Math.abs(emiSavings))}</span></td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="summary-grid">
            <div class="stat-cell">
              <div class="stat-title">Proposed EMI</div>
              <div class="stat-num" style="color:var(--accent-primary);">${formatINR(reqEmi)}</div>
              <div class="stat-sub">${session.sancTenure}m reducing</div>
            </div>
            <div class="stat-cell">
              <div class="stat-title">Monthly EMI Difference</div>
              <div class="stat-num" style="color:var(--color-green);">${formatINR(Math.max(0, emiSavings))}</div>
              <div class="stat-sub">${emiSavings > 0 ? 'Monthly borrower savings' : 'Same as sanctioned'}</div>
            </div>
            <div class="stat-cell">
              <div class="stat-title">PF Upfront Difference</div>
              <div class="stat-num" style="color:var(--accent-secondary);">${formatINR(Math.max(0, pfSavings))}</div>
              <div class="stat-sub">Fee discount</div>
            </div>
            <div class="stat-cell">
              <div class="stat-title">Updated DTI Ratio</div>
              <div class="stat-num" style="color:${dtiResult.warning ? 'var(--color-amber)' : 'var(--color-green)'};">${dtiResult.updatedDti}%</div>
              <div class="stat-sub">Was ${session.currentDti}%</div>
            </div>
          </div>
          ${dtiAlertHtml}
        </div>`;

      appendBotMessage(
        `${t("evalTitle")} — <strong>${escapeHtml(session.caseName)}</strong>:<br>${reportHtml}`,
        [
          { label: t("btnTryRates"), icon: "✏️", primary: true, value: "re_evaluate_rates" },
          { label: t("btnNewCase"), icon: "👤", value: "new_case" }
        ],
        mood, 450
      );
    }

    function reAskProposedRates() {
      session.step = STEPS.REQ_ROI;
      inputHint.textContent = `Enter requested ROI % p.a. (Base: ${session.baseRoi}%, Sanc: ${session.sancRoi}%)`;
      userInput.placeholder = `Benchmark is ${session.baseRoi}%, enter requested ROI...`;
      appendBotMessage(
        `Evaluating new proposed rates for <strong>${escapeHtml(session.caseName)}</strong>.<br>` +
        `Sanctioned Loan: ${formatINR(session.sancAmount)} (${session.sancTenure}m @ ${session.sancRoi}%), Base: ${session.baseRoi}% / ${session.basePf}%.<br><br>` +
        `${t("askReqRoi")}`,
        [
          { label: `${session.baseRoi}% (Base Rate)`, value: String(session.baseRoi), primary: true },
          { label: `${(session.baseRoi - 1.5).toFixed(1)}% (CBO)`, value: String(session.baseRoi - 1.5) },
          { label: `${(session.baseRoi - 3.0).toFixed(1)}% (COO)`, value: String(session.baseRoi - 3.0) },
          { label: `14.5% (<15% CEO Floor)`, value: "14.5" }
        ], "talking"
      );
    }

    const origOnChipSelected = onChipSelected;
    onChipSelected = function(val) {
      if (val === "re_evaluate_rates") {
        appendUserMessage(t("btnTryRates"));
        reAskProposedRates();
      } else if (val === "new_case" || val === "restart") {
        appendUserMessage(t("btnNewCase"));
        restartSession();
      } else {
        origOnChipSelected(val);
      }
    };

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", () => { scrollChatToBottom(); });
    }
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
    window.addEventListener("DOMContentLoaded", () => { startConversation(); });
  </script>
</body>
</html>
