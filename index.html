<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Lendy — Intelligent Loan Pricing & Approval Chatbot</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Lendy is a smart, mobile-first loan pricing, EMI calculation, and approval matrix chatbot.">

  <style>
    /* ==========================================================================
       CSS RESET & VARIABLES
       ========================================================================== */
    :root {
      --bg-canvas: #090e17;
      --bg-panel: #111827;
      --bg-card: #1f2937;
      --bg-card-hover: #283548;
      --border-subtle: #2d3748;
      --border-focus: #3b82f6;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --text-subtle: #6b7280;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-glow: rgba(37, 99, 235, 0.25);
      --accent-cyan: #06b6d4;
      --color-green: #10b981;
      --color-green-bg: rgba(16, 185, 129, 0.15);
      --color-blue: #3b82f6;
      --color-blue-bg: rgba(59, 130, 246, 0.15);
      --color-amber: #f59e0b;
      --color-amber-bg: rgba(245, 158, 11, 0.15);
      --color-red: #ef4444;
      --color-red-bg: rgba(239, 68, 68, 0.15);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-pill: 9999px;
      --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.2);
      --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-canvas);
      color: var(--text-main);
      font-family: var(--font-stack);
      font-size: 15px;
      line-height: 1.5;
    }

    /* Safe Area insets for modern mobile devices */
    body {
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* ==========================================================================
       HEADER & MASCOT
       ========================================================================== */
    .app-header {
      height: 68px;
      background-color: var(--bg-panel);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      z-index: 10;
      box-shadow: var(--shadow-sm);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mascot-container {
      width: 48px;
      height: 48px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Robot-Cat SVG Styling & Animations */
    .mascot-svg {
      width: 100%;
      height: 100%;
      transition: transform 0.2s ease;
      filter: drop-shadow(0 2px 6px rgba(6, 182, 212, 0.3));
    }

    .mascot-svg:hover {
      transform: scale(1.08);
    }

    /* Antenna Pulsing */
    @keyframes antenna-pulse {
      0%, 100% { opacity: 0.5; r: 3.5; fill: #38bdf8; }
      50% { opacity: 1; r: 4.5; fill: #67e8f9; filter: drop-shadow(0 0 4px #06b6d4); }
    }
    .antenna-light {
      animation: antenna-pulse 2s infinite ease-in-out;
    }

    /* Floating Head */
    @keyframes float-head {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }
    .mascot-head-group {
      animation: float-head 3.5s ease-in-out infinite;
      transform-origin: center bottom;
    }

    /* Cat Eyes Blinking */
    @keyframes eyes-blink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
    .eye-pupil {
      transform-origin: center center;
      animation: eyes-blink 4s infinite ease-in-out;
    }

    /* Talking mouth animation */
    @keyframes cat-talking {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(1.8); }
    }
    .mascot-talking .cat-mouth {
      animation: cat-talking 0.25s infinite alternate ease-in-out;
      transform-origin: center;
    }

    /* Bouncing celebration */
    @keyframes cat-celebrating {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-4px) rotate(-3deg); }
      75% { transform: translateY(-4px) rotate(3deg); }
    }
    .mascot-celebrating {
      animation: cat-celebrating 0.6s infinite ease-in-out;
    }

    .header-info h1 {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-info p {
      font-size: 12px;
      color: var(--accent-cyan);
      font-weight: 500;
    }

    .restart-btn {
      min-height: 44px;
      min-width: 44px;
      padding: 8px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-pill);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .restart-btn:hover {
      background: var(--bg-card-hover);
      color: var(--text-main);
      border-color: var(--border-focus);
    }

    /* ==========================================================================
       CHAT HISTORY CONTAINER
       ========================================================================== */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px 16px 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .message-row {
      display: flex;
      gap: 10px;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      opacity: 0;
      transform: translateY(8px);
      animation: message-appear 0.28s ease-out forwards;
    }

    @keyframes message-appear {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      margin-top: 2px;
    }

    .message-avatar.bot {
      background: linear-gradient(135deg, #1e3a8a, #06b6d4);
      color: white;
      box-shadow: 0 2px 8px rgba(6, 182, 212, 0.3);
    }

    .message-bubble {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      line-height: 1.55;
      font-size: 14.5px;
      position: relative;
      word-break: break-word;
    }

    .message-row.bot .message-bubble {
      background-color: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      border-top-left-radius: 4px;
      box-shadow: var(--shadow-sm);
    }

    .message-row.user .message-bubble {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border-top-right-radius: 4px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .message-row.user .message-avatar {
      display: none;
    }

    /* Typing Dots */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 4px;
    }

    .typing-dot {
      width: 7px;
      height: 7px;
      background-color: var(--accent-cyan);
      border-radius: 50%;
      animation: typing-bounce 1.4s infinite ease-in-out both;
    }

    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes typing-bounce {
      0%, 80%, 100% { transform: scale(0.4); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* ==========================================================================
       RESULT CARD & TABLES
       ========================================================================== */
    .result-card {
      background-color: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-top: 10px;
      box-shadow: var(--shadow-md);
    }

    .verdict-banner {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 15px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .verdict-banner.green {
      background: var(--color-green-bg);
      color: var(--color-green);
      border-bottom-color: rgba(16, 185, 129, 0.3);
    }

    .verdict-banner.blue {
      background: var(--color-blue-bg);
      color: var(--color-blue);
      border-bottom-color: rgba(59, 130, 246, 0.3);
    }

    .verdict-banner.amber {
      background: var(--color-amber-bg);
      color: var(--color-amber);
      border-bottom-color: rgba(245, 158, 11, 0.3);
    }

    .verdict-banner.red {
      background: var(--color-red-bg);
      color: var(--color-red);
      border-bottom-color: rgba(239, 68, 68, 0.3);
    }

    .verdict-explanation {
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.02);
      font-size: 13.5px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-subtle);
      line-height: 1.5;
    }

    .verdict-explanation strong {
      color: var(--text-main);
    }

    .comparison-table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    .comparison-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .comparison-table th, 
    .comparison-table td {
      padding: 10px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border-subtle);
    }

    .comparison-table th {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-subtle);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.04em;
    }

    .comparison-table td:last-child,
    .comparison-table th:last-child {
      text-align: right;
    }

    .tag-deviation {
      display: inline-block;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 600;
    }

    .tag-deviation.neutral { background: rgba(156, 163, 175, 0.2); color: var(--text-muted); }
    .tag-deviation.favorable { background: var(--color-green-bg); color: var(--color-green); }
    .tag-deviation.cbo { background: var(--color-blue-bg); color: var(--color-blue); }
    .tag-deviation.coo { background: var(--color-amber-bg); color: var(--color-amber); }
    .tag-deviation.ceo { background: var(--color-red-bg); color: var(--color-red); }

    /* Summary Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 12px 14px;
      background: var(--bg-card);
    }

    @media (min-width: 600px) {
      .metrics-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .metric-cell {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
    }

    .metric-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .metric-value {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
    }

    .metric-sub {
      font-size: 11px;
      color: var(--text-subtle);
      margin-top: 1px;
    }

    /* DTI Alert Banner */
    .dti-alert {
      margin: 12px 14px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      background: var(--color-amber-bg);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fef3c7;
      font-size: 12.5px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.4;
    }

    /* ==========================================================================
       CHIPS & ACTION AREA
       ========================================================================== */
    .chips-area {
      padding: 8px 16px 12px 16px;
      background-color: var(--bg-canvas);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-start;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
    }

    .chip-btn {
      min-height: 44px;
      padding: 10px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-pill);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease-out;
      box-shadow: var(--shadow-sm);
    }

    .chip-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-focus);
      transform: translateY(-1px);
    }

    .chip-btn:active {
      transform: scale(0.97);
    }

    .chip-btn.primary {
      background: linear-gradient(135deg, #1e40af, #2563eb);
      border-color: #3b82f6;
    }

    /* ==========================================================================
       BOTTOM INPUT BAR
       ========================================================================== */
    .input-bar-wrapper {
      background-color: var(--bg-panel);
      border-top: 1px solid var(--border-subtle);
      padding: 10px 16px;
      flex-shrink: 0;
      z-index: 20;
    }

    .input-form {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chat-input {
      flex: 1;
      min-height: 46px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-pill);
      padding: 10px 20px;
      color: var(--text-main);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }

    .chat-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .chat-input::placeholder {
      color: var(--text-subtle);
      font-size: 14px;
    }

    .send-btn {
      min-width: 46px;
      min-height: 46px;
      width: 46px;
      height: 46px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    }

    .send-btn:hover {
      transform: scale(1.05);
      background: linear-gradient(135deg, #3b82f6, #2563eb);
    }

    .send-btn:active {
      transform: scale(0.95);
    }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .send-btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      margin-left: 2px;
    }

    /* Subtle helper notes */
    .input-hint {
      font-size: 11.5px;
      color: var(--text-subtle);
      margin-top: 4px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- ========================================================================
       TOP NAVIGATION & MASCOT
       ======================================================================== -->
  <header class="app-header">
    <div class="header-left">
      <!-- Animated SVG Mascot "Lendy" (Robot-Cat) -->
      <div class="mascot-container" id="mascotWrapper" title="Lendy the Robot-Cat" onclick="triggerMascotMeow()">
        <svg class="mascot-svg" id="lendyMascot" viewBox="0 0 80 80" role="img" aria-label="Lendy Robot-Cat Mascot">
          <defs>
            <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#38bdf8"/>
              <stop offset="100%" stop-color="#1e40af"/>
            </linearGradient>
            <linearGradient id="visorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#020617"/>
              <stop offset="100%" stop-color="#0f172a"/>
            </linearGradient>
            <linearGradient id="earInner" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f472b6"/>
              <stop offset="100%" stop-color="#db2777"/>
            </linearGradient>
          </defs>

          <!-- Antenna -->
          <line x1="40" y1="20" x2="40" y2="9" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="40" cy="7" r="4" fill="#38bdf8" class="antenna-light"/>

          <!-- Head Group (Floating) -->
          <g class="mascot-head-group">
            <!-- Left Cat Ear -->
            <polygon points="21,30 11,10 32,21" fill="url(#bodyGrad)"/>
            <polygon points="21,27 15,14 29,21" fill="url(#earInner)"/>

            <!-- Right Cat Ear -->
            <polygon points="59,30 69,10 48,21" fill="url(#bodyGrad)"/>
            <polygon points="59,27 65,14 51,21" fill="url(#earInner)"/>

            <!-- Head Capsule -->
            <rect x="16" y="19" width="48" height="42" rx="18" fill="url(#bodyGrad)" stroke="#67e8f9" stroke-width="1.5"/>

            <!-- Visor Screen -->
            <rect x="20" y="25" width="40" height="25" rx="10" fill="url(#visorGrad)" stroke="#1e293b" stroke-width="1"/>

            <!-- Robot Whiskers (Left) -->
            <line x1="8" y1="36" x2="17" y2="38" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
            <line x1="9" y1="42" x2="17" y2="42" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

            <!-- Robot Whiskers (Right) -->
            <line x1="63" y1="38" x2="72" y2="36" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
            <line x1="63" y1="42" x2="71" y2="42" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

            <!-- Dynamic Eyes & Face Elements -->
            <g id="mascotFace">
              <!-- Default Idle Eyes -->
              <ellipse id="eyeLeft" class="eye-pupil" cx="30" cy="36" rx="4.5" ry="5.5" fill="#38bdf8"/>
              <ellipse id="eyeRight" class="eye-pupil" cx="50" cy="36" rx="4.5" ry="5.5" fill="#38bdf8"/>
              <circle cx="31.5" cy="34" r="1.5" fill="#ffffff"/>
              <circle cx="51.5" cy="34" r="1.5" fill="#ffffff"/>

              <!-- Cute Cat Mouth -->
              <path id="mascotMouth" class="cat-mouth" d="M36,44 Q40,47 44,44" stroke="#38bdf8" stroke-width="1.8" fill="none" stroke-linecap="round"/>
            </g>

            <!-- Collar with Bell / Badge -->
            <rect x="28" y="59" width="24" height="4" rx="2" fill="#f59e0b"/>
            <circle cx="40" cy="62" r="3" fill="#fbbf24" stroke="#b45309" stroke-width="0.8"/>
          </g>
        </svg>
      </div>

      <div class="header-info">
        <h1>Lendy <span style="font-size: 13px; font-weight: normal; color: var(--text-subtle);">● Active</span></h1>
        <p>Loan Pricing & Approval AI</p>
      </div>
    </div>

    <div>
      <button class="restart-btn" id="restartBtn" onclick="restartConversation()" aria-label="Restart conversation">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
        <span>Restart</span>
      </button>
    </div>
  </header>

  <!-- ========================================================================
       CHAT STREAM
       ======================================================================== -->
  <main class="chat-container" id="chatContainer" aria-live="polite">
    <!-- Messages appended dynamically -->
  </main>

  <!-- ========================================================================
       QUICK-REPLY CHIPS
       ======================================================================== -->
  <div class="chips-area" id="chipsArea" role="group" aria-label="Quick reply options">
    <!-- Interactive chips injected here -->
  </div>

  <!-- ========================================================================
       STICKY INPUT BAR
       ======================================================================== -->
  <footer class="input-bar-wrapper">
    <form class="input-form" id="inputForm" onsubmit="event.preventDefault(); submitInput();">
      <input 
        type="text" 
        id="userInput" 
        class="chat-input" 
        placeholder="Type your answer here..." 
        autocomplete="off" 
        enterkeyhint="send"
        aria-label="User response"
      >
      <button type="submit" id="sendBtn" class="send-btn" aria-label="Send message">
        <svg viewBox="0 0 24 24">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </form>
    <div class="input-hint" id="inputHint">Tap a chip or type your answer above</div>
  </footer>

  <!-- ========================================================================
       CORE LOGIC & CONFIGURATION (VANILLA JAVASCRIPT)
       ======================================================================== -->
  <script>
    /* ==========================================================================
       CONFIG BLOCK — Loan Pricing & Approval Business Rules
       ========================================================================== */
    const CONFIG = {
      APP_NAME: "Lendy Loan Pricing & Approval Chatbot",
      VERSION: "1.0.0",
      DTI_LIMIT_PERCENT: 50.0,
      ROUNDING_TOLERANCE: 1e-6,

    /* ==========================================================================
       PURE DOMAIN & FINANCIAL FUNCTIONS
       ========================================================================== */
    function deriveTicketSize(product, loanAmount) {
      if (product === "Regular Secured Business Loan") {
        return loanAmount <= 500000.0 ? "Upto 5 Lacs" : "Above 5 Lacs";
      }
      return "All Ticket Size";
    }

    function lookupBaseRates(product, ticketSize, incomeProgram, propertyType, bureau) {
      const match = CONFIG.MATRIX.find(row => 
        row.product === product &&
        row.ticket === ticketSize &&
        row.income === incomeProgram &&
        row.property === propertyType &&
        row.bureau === bureau
      );
      if (match) {
        return { baseRoi: match.baseRoi, basePf: match.basePf };
      }
      return null;
    }

    function getApproverForDeviation(deviation, bandType) {
      const eps = CONFIG.ROUNDING_TOLERANCE;
      if (deviation <= eps) {
        return "NONE";
      }
      const bands = CONFIG.BANDS[bandType];
      for (let i = 0; i < bands.length; i++) {
        if (deviation <= bands[i].max + eps) {
          return bands[i].approver;
        }
      }
      return "CEO";
    }

    function determineFinalApproval(baseRoi, reqRoi, basePf, reqPf) {
      const roiDeviation = parseFloat((baseRoi - reqRoi).toFixed(4));
      const pfDeviation = parseFloat((basePf - reqPf).toFixed(4));

      const roiApprover = getApproverForDeviation(roiDeviation, "ROI");
      const pfApprover = getApproverForDeviation(pfDeviation, "PF");

      const levelRoi = CONFIG.APPROVERS[roiApprover].level;
      const levelPf = CONFIG.APPROVERS[pfApprover].level;

      const finalKey = levelRoi >= levelPf ? roiApprover : pfApprover;
      const approverInfo = CONFIG.APPROVERS[finalKey];

      // Formulate human-friendly explanation
      let explanation = "";
      if (finalKey === "NONE") {
        explanation = "Requested rates match or exceed benchmark requirements. Standard processing without deviation.";
      } else {
        const reasons = [];
        if (roiApprover !== "NONE") {
          reasons.push(`ROI discount of ${roiDeviation.toFixed(2)}% requires ${CONFIG.APPROVERS[roiApprover].name}`);
        }
        if (pfApprover !== "NONE") {
          reasons.push(`PF waiver/discount of ${pfDeviation.toFixed(2)}% requires ${CONFIG.APPROVERS[pfApprover].name}`);
        }
        explanation = reasons.join(", and ") + `. Governed by highest authority: ${approverInfo.name} (${approverInfo.title}).`;
      }

      return {
        roiDeviation,
        pfDeviation,
        roiApprover,
        pfApprover,
        finalApproverKey: finalKey,
        finalApproverName: approverInfo.name,
        color: approverInfo.color,
        requiresApproval: finalKey !== "NONE",
        explanation
      };
    }

    function calculateReducingEMI(principal, annualRatePct, tenureMonths) {
      if (tenureMonths <= 0) return 0;
      if (annualRatePct <= 0) return principal / tenureMonths;

      const r = annualRatePct / 12.0 / 100.0;
      const factor = Math.pow(1.0 + r, tenureMonths);
      const emi = (principal * r * factor) / (factor - 1.0);
      return emi;
    }

    function calculateDTI(existingEmis, newEmi, monthlyIncome) {
      if (monthlyIncome <= 0) return { currentDti: 0, updatedDti: 0, warning: false };
      const currentDti = (existingEmis / monthlyIncome) * 100.0;
      const updatedDti = ((existingEmis + newEmi) / monthlyIncome) * 100.0;
      const warning = updatedDti > CONFIG.DTI_LIMIT_PERCENT;
      return {
        currentDti: parseFloat(currentDti.toFixed(2)),
        updatedDti: parseFloat(updatedDti.toFixed(2)),
        warning
      };
    }

    /* ==========================================================================
       PARSING & FORMATTING UTILITIES
       ========================================================================== */
    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatINR(number) {
      if (isNaN(number)) return "₹0";
      return "₹" + Math.round(number).toLocaleString("en-IN");
    }

    function formatNumberTwoDecimals(number) {
      if (isNaN(number)) return "0.00";
      return parseFloat(number).toFixed(2);
    }

    function parseLoanAmount(text) {
      if (!text) return null;
      let clean = text.toLowerCase().trim().replace(/,/g, "").replace(/₹/g, "").replace(/rs\.?/g, "");

      // Handle Crores
      if (clean.includes("cr") || clean.includes("crore")) {
        const num = parseFloat(clean.replace(/crores?|cr/g, "").trim());
        return isNaN(num) || num <= 0 ? null : num * 10000000;
      }

      // Handle Lakhs / Lacs
      if (clean.includes("lakh") || clean.includes("lac")) {
        const num = parseFloat(clean.replace(/lakhs?|lacs?|lac/g, "").trim());
        return isNaN(num) || num <= 0 ? null : num * 100000;
      }

      // Handle Thousands (k)
      if (clean.includes("k")) {
        const num = parseFloat(clean.replace(/k/g, "").trim());
        return isNaN(num) || num <= 0 ? null : num * 1000;
      }

      const num = parseFloat(clean);
      return isNaN(num) || num <= 0 ? null : num;
    }

    function parseTenure(text) {
      if (!text) return null;
      let clean = text.toLowerCase().trim().replace(/,/g, "");

      // Years
      if (clean.includes("year") || clean.includes("yr") || clean.includes("y")) {
        const num = parseFloat(clean.replace(/years?|yrs?|y/g, "").trim());
        if (isNaN(num) || num <= 0) return null;
        const months = Math.round(num * 12);
        return months >= 3 && months <= 360 ? months : null;
      }

      // Months
      if (clean.includes("month") || clean.includes("m")) {
        const num = parseFloat(clean.replace(/months?|m/g, "").trim());
        if (isNaN(num) || num <= 0) return null;
        return num >= 3 && num <= 360 ? Math.round(num) : null;
      }

      const num = parseFloat(clean);
      if (isNaN(num) || num < 3 || num > 360) return null;
      return Math.round(num);
    }

    function parseNumber(text) {
      if (!text) return null;
      let clean = text.toLowerCase().trim().replace(/,/g, "").replace(/₹/g, "").replace(/rs\.?/g, "");
      if (["nil", "none", "zero", "0", "na", "no"].includes(clean)) {
        return 0.0;
      }
      return parseLoanAmount(clean);
    }

    function appendBotMessage(htmlContent, chips = [], newExpression = "idle", delayMs = 380) {
      const currentToken = conversationToken;
      setMascotExpression("thinking");

      // Show typing dots
      const typingRow = document.createElement("div");
      typingRow.className = "message-row bot typing-indicator-row";
      typingRow.innerHTML = `
        <div class="message-avatar bot">🐱</div>
        <div class="message-bubble">
          <div class="typing-indicator">
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
          </div>
        </div>
      `;
      chatContainer.appendChild(typingRow);
      scrollChatToBottom();

      // Disable inputs while thinking
      userInput.disabled = true;
      sendBtn.disabled = true;
      chipsArea.innerHTML = "";

      setTimeout(() => {
        // Discard stale message if conversation was restarted
        if (currentToken !== conversationToken) return;

        typingRow.remove();
        setMascotExpression("talking");

        const msgRow = document.createElement("div");
        msgRow.className = "message-row bot";
        msgRow.innerHTML = `
          <div class="message-avatar bot">🐱</div>
          <div class="message-bubble">${htmlContent}</div>
        `;
        chatContainer.appendChild(msgRow);

        // Render tappable chips
        renderChips(chips);

        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
        scrollChatToBottom();

        setTimeout(() => {
          if (currentToken === conversationToken) {
            setMascotExpression(newExpression);
          }
        }, 600);
      }, delayMs);
    }

    function renderChips(chips) {
      chipsArea.innerHTML = "";
      if (!chips || chips.length === 0) {
        chipsArea.style.display = "none";
        return;
      }
      chipsArea.style.display = "flex";
      chips.forEach(chip => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `chip-btn ${chip.primary ? 'primary' : ''}`;
        btn.innerHTML = `${chip.icon ? chip.icon + ' ' : ''}<span>${escapeHtml(chip.label)}</span>`;
        btn.onclick = () => onChipSelected(chip.value !== undefined ? chip.value : chip.label);
        chipsArea.appendChild(btn);
      });
    }

    function onChipSelected(value) {
      handleStepInput(value);
    }

    function submitInput() {
      const text = userInput.value.trim();
      if (!text) return;
      handleStepInput(text);
      userInput.value = "";
    }

    /* ==========================================================================
       CONVERSATIONAL DIALOGUE STATE MACHINE
       ========================================================================== */
    function startDialogue() {
      session = {
        customerName: "",
        product: "",
        incomeProgram: "",
        propertyType: "",
        bureau: "",
        loanAmount: 0,
        ticketSize: "",
        tenureMonths: 0,
        incomeFrequency: "Monthly",
        monthlyIncome: 0,
        existingEmis: 0,
        baseRoi: 0,
        basePf: 0,
        requestedRoi: 0,
        requestedPf: 0,
        step: STEPS.CUSTOMER_NAME
      };

      chatContainer.innerHTML = "";
      inputHint.textContent = "Enter customer full name";
      userInput.placeholder = "e.g. Ramesh Patel, Priya Sharma...";

      appendBotMessage(
        `👋 Hello! I'm <strong>Lendy</strong>, your loan pricing and matrix approval specialist.<br><br>Let's calculate the exact benchmark rates, EMI, and authority sign-offs for your customer.<br><br>To begin, <strong>what is the customer's full name?</strong>`,
        [],
        "happy",
        200
      );
    }

    function restartConversation() {
      conversationToken++;
      setMascotExpression("idle");
      startDialogue();
    }

    function handleStepInput(inputStr) {
      const clean = String(inputStr).trim();
      if (!clean) return;

      appendUserMessage(clean);

      switch (session.step) {
        case STEPS.CUSTOMER_NAME: {
          session.customerName = clean;
          session.step = STEPS.PRODUCT;
          inputHint.textContent = "Select loan product from chips below";
          userInput.placeholder = "Or type product name...";

          appendBotMessage(
            `Great to meet you, <strong>${escapeHtml(session.customerName)}</strong>! 😊<br>Which <strong>Loan Product</strong> are we pricing today?`,
            [
              { label: "Regular Secured Business Loan", icon: "🏢", primary: true },
              { label: "Secured Working Capital Term Loan", icon: "💼" },
              { label: "Hypothecation Loans", icon: "🚗" }
            ],
            "talking"
          );
          break;
        }

        case STEPS.PRODUCT: {
          const validProducts = [
            "Regular Secured Business Loan",
            "Secured Working Capital Term Loan",
            "Hypothecation Loans"
          ];
          const matched = validProducts.find(p => p.toLowerCase() === clean.toLowerCase() || clean.toLowerCase().includes(p.toLowerCase().substring(0, 10)));
          if (!matched) {
            appendBotMessage(
              `Please pick one of our three standard loan products using the options below:`,
              validProducts.map(p => ({ label: p })),
              "worried"
            );
            return;
          }

          session.product = matched;
          session.step = STEPS.INCOME_PROGRAM;
          inputHint.textContent = "Select customer income program";
          userInput.placeholder = "Select income program...";

          appendBotMessage(
            `Got it: <strong>${session.product}</strong>. 👍<br><br>Under which <strong>Income Program</strong> is this loan being assessed?`,
            [
              { label: "Documented Income Program", icon: "📑", primary: true },
              { label: "Assessed Income Program", icon: "🔍" },
              { label: "Hybrid Income Program", icon: "⚡" },
              { label: "Semi Documented Income Program", icon: "📂" }
            ],
            "talking"
          );
          break;
        }

        case STEPS.INCOME_PROGRAM: {
          const programs = [
            "Documented Income Program",
            "Assessed Income Program",
            "Hybrid Income Program",
            "Semi Documented Income Program"
          ];
          const matched = programs.find(p => p.toLowerCase() === clean.toLowerCase() || p.toLowerCase().startsWith(clean.toLowerCase()));
          if (!matched) {
            appendBotMessage(
              `Kindly select one of the four recognized income programs:`,
              programs.map(p => ({ label: p })),
              "worried"
            );
            return;
          }

          session.incomeProgram = matched;

          // Rule 8: If product is Hypothecation Loans, property type is NA -> Skip question!
          if (session.product === "Hypothecation Loans") {
            session.propertyType = "NA";
            session.step = STEPS.BUREAU;
            inputHint.textContent = "Select Bureau category";
            userInput.placeholder = "Select bureau score...";

            appendBotMessage(
              `For <strong>Hypothecation Loans</strong>, Property Type is not applicable (NA) and skipped automatically! ⚡<br><br>What is the borrower's <strong>Bureau Category</strong>?`,
              [
                { label: ">=700 or NTC", icon: "⭐", primary: true },
                { label: "<700", icon: "📊" }
              ],
              "happy"
            );
          } else {
            session.step = STEPS.PROPERTY_TYPE;
            inputHint.textContent = "Select Property Type";
            userInput.placeholder = "Select property type...";

            appendBotMessage(
              `Recorded <strong>${session.incomeProgram}</strong>. 📋<br><br>What is the <strong>Property Type</strong> mortgaged?`,
              [
                { label: "SORP", icon: "🏠", primary: true },
                { label: "Other", icon: "🏢" }
              ],
              "talking"
            );
          }
          break;
        }

        case STEPS.PROPERTY_TYPE: {
          const props = ["SORP", "Other"];
          const matched = props.find(p => p.toLowerCase() === clean.toLowerCase());
          if (!matched) {
            appendBotMessage(
              `Please select whether the property is <strong>SORP</strong> (Self-Occupied Residential Property) or <strong>Other</strong>:`,
              props.map(p => ({ label: p })),
              "worried"
            );
            return;
          }

          session.propertyType = matched;
          session.step = STEPS.BUREAU;
          inputHint.textContent = "Select Bureau category";
          userInput.placeholder = "Select bureau score...";

          appendBotMessage(
            `Property recorded as <strong>${session.propertyType}</strong>.<br><br>Now, what is the borrower's <strong>Bureau Category</strong>?`,
            [
              { label: ">=700 or NTC", icon: "⭐", primary: true },
              { label: "<700", icon: "📊" }
            ],
            "talking"
          );
          break;
        }

        case STEPS.BUREAU: {
          let matched = null;
          if (clean.includes(">=700") || clean.toLowerCase().includes("ntc") || clean.includes("700+")) {
            matched = ">=700 or NTC";
          } else if (clean.includes("<700") || clean.toLowerCase().includes("below")) {
            matched = "<700";
          }

          if (!matched) {
            appendBotMessage(
              `Please indicate if the bureau score is <strong>&gt;=700 or NTC</strong> (New to Credit) or <strong>&lt;700</strong>:`,
              [
                { label: ">=700 or NTC", icon: "⭐" },
                { label: "<700", icon: "📊" }
              ],
              "worried"
            );
            return;
          }

          session.bureau = matched;
          session.step = STEPS.LOAN_AMOUNT;
          inputHint.textContent = "Enter loan amount (e.g. 5 lakh, 10,00,000, 1.2 cr)";
          userInput.placeholder = "e.g. 10 Lakhs, 10,00,000, 500000...";

          appendBotMessage(
            `Bureau recorded: <strong>${session.bureau}</strong>. 📈<br><br>What is the <strong>Loan Amount</strong> requested? (You can type e.g. <em>"10 lakh"</em>, <em>"10,00,000"</em>, or <em>"1.2 cr"</em>)`,
            [
              { label: "5 Lakhs", value: "500000" },
              { label: "10 Lakhs", value: "1000000", primary: true },
              { label: "25 Lakhs", value: "2500000" },
              { label: "50 Lakhs", value: "5000000" }
            ],
            "talking"
          );
          break;
        }

        case STEPS.LOAN_AMOUNT: {
          const parsedAmount = parseLoanAmount(clean);
          if (!parsedAmount || parsedAmount <= 0) {
            appendBotMessage(
              `Hmm, I couldn't understand that amount. Please enter a positive figure like <strong>5 lakh</strong>, <strong>10,00,000</strong>, or <strong>1.5 cr</strong>:`,
              [
                { label: "5 Lakhs", value: "500000" },
                { label: "10 Lakhs", value: "1000000" },
                { label: "25 Lakhs", value: "2500000" }
              ],
              "worried"
            );
            return;
          }

          session.loanAmount = parsedAmount;
          // Derive Ticket size automatically
          session.ticketSize = deriveTicketSize(session.product, session.loanAmount);

          session.step = STEPS.TENURE;
          inputHint.textContent = "Enter loan tenure (e.g. 36 months, 5 years)";
          userInput.placeholder = "e.g. 60 months, 5 years, 36...";

          appendBotMessage(
            `Loan Amount: <strong>${formatINR(session.loanAmount)}</strong>.<br><em>Derived Ticket Size: <strong>${session.ticketSize}</strong></em>. 🏷️<br><br>What is the proposed <strong>Loan Tenure</strong>? (Min 3 months, Max 360 months)`,
            [
              { label: "3 Years (36m)", value: "36 months" },
              { label: "5 Years (60m)", value: "60 months", primary: true },
              { label: "7 Years (84m)", value: "84 months" },
              { label: "10 Years (120m)", value: "120 months" }
            ],
            "talking"
          );
          break;
        }

        case STEPS.TENURE: {
          const parsedMonths = parseTenure(clean);
          if (!parsedMonths) {
            appendBotMessage(
              `Please enter a valid tenure between <strong>3 months and 360 months</strong> (e.g. <em>"60 months"</em> or <em>"5 years"</em>):`,
              [
                { label: "36 months" },
                { label: "60 months", primary: true },
                { label: "84 months" },
                { label: "120 months" }
              ],
              "worried"
            );
            return;
          }

          session.tenureMonths = parsedMonths;
          session.step = STEPS.INCOME_FREQ;
          inputHint.textContent = "Select Monthly or Annual income";
          userInput.placeholder = "Select income frequency...";

          appendBotMessage(
            `Tenure: <strong>${session.tenureMonths} months (${(session.tenureMonths / 12).toFixed(1)} years)</strong>. ⏳<br><br>How would you like to declare the customer's income?`,
            [
              { label: "Monthly Income", value: "Monthly", icon: "📅", primary: true },
              { label: "Annual Income", value: "Annual", icon: "📊" }
            ],
            "talking"
          );
          break;
        }

        case STEPS.INCOME_FREQ: {
          const freq = clean.toLowerCase().includes("ann") ? "Annual" : "Monthly";
          session.incomeFrequency = freq;
          session.step = STEPS.INCOME_AMOUNT;
          inputHint.textContent = `Enter ${freq.toLowerCase()} income amount`;
          userInput.placeholder = freq === "Annual" ? "e.g. 12 lakh, 12,00,000..." : "e.g. 80,000, 1 lakh...";

          appendBotMessage(
            `Selected <strong>${freq} Income</strong>. What is the customer's gross ${freq.toLowerCase()} earnings?`,
            freq === "Annual" ? [
              { label: "₹6 Lakhs", value: "600000" },
              { label: "₹12 Lakhs", value: "1200000", primary: true },
              { label: "₹24 Lakhs", value: "2400000" }
            ] : [
              { label: "₹50,000", value: "50000" },
              { label: "₹80,000", value: "80000", primary: true },
              { label: "₹1,50,000", value: "150000" }
            ],
            "talking"
          );
          break;
        }

        case STEPS.INCOME_AMOUNT: {
          const parsed = parseNumber(clean);
          if (!parsed || parsed <= 0) {
            appendBotMessage(
              `Please enter a valid positive income figure (e.g. <em>"80,000"</em> or <em>"12 lakh"</em>):`,
              [],
              "worried"
            );
            return;
          }

          if (session.incomeFrequency === "Annual") {
            session.monthlyIncome = parsed / 12.0;
          } else {
            session.monthlyIncome = parsed;
          }

          session.step = STEPS.EXISTING_EMIS;
          inputHint.textContent = "Enter total existing monthly EMIs / debt obligations (0 if none)";
          userInput.placeholder = "e.g. 20,000 or 0...";

          appendBotMessage(
            `Normalized Monthly Income: <strong>${formatINR(session.monthlyIncome)}/month</strong>. 💼<br><br>What are the borrower's <strong>total existing monthly EMIs / debt obligations</strong>? (Enter <strong>0</strong> or <em>"None"</em> if zero)`,
            [
              { label: "0 (No obligations)", value: "0", primary: true },
              { label: "₹10,000", value: "10000" },
              { label: "₹20,000", value: "20000" },
              { label: "₹35,000", value: "35000" }
            ],
            "talking"
          );
          break;
        }

        case STEPS.EXISTING_EMIS: {
          const parsed = parseNumber(clean);
          if (parsed === null || parsed < 0) {
            appendBotMessage(
              `Please enter a non-negative number for existing EMIs (type <strong>0</strong> if there are no existing loans):`,
              [{ label: "0", value: "0" }],
              "worried"
            );
            return;
          }

          session.existingEmis = parsed;

          // Look up Base Rates in Matrix
          const baseRates = lookupBaseRates(
            session.product,
            session.ticketSize,
            session.incomeProgram,
            session.propertyType,
            session.bureau
          );

          if (!baseRates) {
            appendBotMessage(
              `⚠️ <strong>Policy Matrix Notice:</strong> No standard rate entry exists for this exact parameter combination.<br><br>` +
              `• Product: ${session.product}<br>` +
              `• Ticket: ${session.ticketSize}<br>` +
              `• Income: ${session.incomeProgram}<br>` +
              `• Property: ${session.propertyType}<br>` +
              `• Bureau: ${session.bureau}<br><br>` +
              `This special policy exception requires <strong>CEO / Credit Committee Approval</strong>.`,
              [{ label: "Start Over", value: "restart" }],
              "worried"
            );
            return;
          }

          session.baseRoi = baseRates.baseRoi;
          session.basePf = baseRates.basePf;

          session.step = STEPS.REQUESTED_ROI;
          inputHint.textContent = "Enter requested ROI % p.a. (0 - 60)";
          userInput.placeholder = `Benchmark is ${session.baseRoi}%, enter requested ROI...`;

          appendBotMessage(
            `🎉 <strong>Benchmark Matrix Found!</strong><br><br>` +
            `Based on your customer's profile, the standard benchmark rates are:<br>` +
            `• <strong>Base ROI:</strong> <span style="color:#60a5fa; font-weight:700;">${session.baseRoi.toFixed(2)}% p.a.</span><br>` +
            `• <strong>Base Processing Fee (PF):</strong> <span style="color:#60a5fa; font-weight:700;">${session.basePf.toFixed(2)}%</span><br><br>` +
            `Now, what <strong>Requested ROI (% p.a.)</strong> would you like to propose?`,
            [
              { label: `${session.baseRoi}% (Base Rate)`, value: String(session.baseRoi), primary: true },
              { label: `${(session.baseRoi - 1.5).toFixed(1)}% (-1.5% CBO)`, value: String(session.baseRoi - 1.5) },
              { label: `${(session.baseRoi - 3.0).toFixed(1)}% (-3.0% COO)`, value: String(session.baseRoi - 3.0) },
              { label: `${(session.baseRoi - 4.5).toFixed(1)}% (-4.5% CEO)`, value: String(session.baseRoi - 4.5) }
            ],
            "surprised"
          );
          break;
        }

        case STEPS.REQUESTED_ROI: {
          const num = parseFloat(clean.replace(/%/g, ""));
          if (isNaN(num) || num < 0 || num > 60) {
            appendBotMessage(
              `Please enter a realistic requested annual ROI between <strong>0% and 60%</strong>:`,
              [{ label: `${session.baseRoi}%`, value: String(session.baseRoi) }],
              "worried"
            );
            return;
          }

          session.requestedRoi = num;
          session.step = STEPS.REQUESTED_PF;
          inputHint.textContent = "Enter requested PF % (0 - 15)";
          userInput.placeholder = `Benchmark is ${session.basePf}%, enter requested PF...`;

          appendBotMessage(
            `Requested ROI recorded: <strong>${session.requestedRoi.toFixed(2)}% p.a.</strong> (Base is ${session.baseRoi.toFixed(2)}%).<br><br>` +
            `What <strong>Requested Processing Fee (PF %)</strong> are you seeking?`,
            [
              { label: `${session.basePf}% (Full PF)`, value: String(session.basePf), primary: true },
              { label: `${Math.max(0, session.basePf - 0.8).toFixed(1)}% (CBO)`, value: String(Math.max(0, session.basePf - 0.8)) },
              { label: `${Math.max(0, session.basePf - 1.2).toFixed(1)}% (COO)`, value: String(Math.max(0, session.basePf - 1.2)) },
              { label: `${Math.max(0, session.basePf - 1.6).toFixed(1)}% (CEO)`, value: String(Math.max(0, session.basePf - 1.6)) }
            ],
            "talking"
          );
          break;
        }

        case STEPS.REQUESTED_PF: {
          const num = parseFloat(clean.replace(/%/g, ""));
          if (isNaN(num) || num < 0 || num > 15) {
            appendBotMessage(
              `Please enter a valid Processing Fee between <strong>0% and 15%</strong>:`,
              [{ label: `${session.basePf}%`, value: String(session.basePf) }],
              "worried"
            );
            return;
          }

          session.requestedPf = num;
          session.step = STEPS.COMPLETED;
          inputHint.textContent = "Select an action below or test other rates";
          userInput.placeholder = "Click 'Try different ROI / PF' or 'New customer'";

          // Execute full evaluation and display verdict
          renderFullLoanVerdict();
          break;
        }

        case STEPS.COMPLETED: {
          if (clean.toLowerCase().includes("different") || clean.toLowerCase().includes("try")) {
            reAskRatesOnly();
          } else if (clean.toLowerCase().includes("new")) {
            restartConversation();
          } else {
            appendBotMessage(
              `Would you like to test another rate structure or start a new borrower assessment?`,
              [
                { label: "Try different ROI / PF", icon: "✏️", primary: true },
                { label: "New customer", icon: "👤" }
              ],
              "idle"
            );
          }
          break;
        }
      }
    }

    /* ==========================================================================
       RESULT CARD GENERATOR
       ========================================================================== */
    function renderFullLoanVerdict() {
      // 1. Approval Engine
      const approval = determineFinalApproval(
        session.baseRoi,
        session.requestedRoi,
        session.basePf,
        session.requestedPf
      );

      // 2. Reducing Balance EMI Calculations
      const baseEmi = calculateReducingEMI(session.loanAmount, session.baseRoi, session.tenureMonths);
      const reqEmi = calculateReducingEMI(session.loanAmount, session.requestedRoi, session.tenureMonths);
      const emiDiff = baseEmi - reqEmi;

      // 3. PF Amounts
      const basePfAmount = (session.loanAmount * session.basePf) / 100.0;
      const reqPfAmount = (session.loanAmount * session.requestedPf) / 100.0;
      const pfSavings = basePfAmount - reqPfAmount;

      // 4. DTI Analysis
      const dti = calculateDTI(session.existingEmis, reqEmi, session.monthlyIncome);

      // Emotional mascot reaction
      let mascotExpression = "celebrating";
      if (approval.finalApproverKey === "CBO") mascotExpression = "happy";
      else if (approval.finalApproverKey === "COO") mascotExpression = "surprised";
      else if (approval.finalApproverKey === "CEO") mascotExpression = "worried";

      // Deviation Badge formatting
      function getBadge(dev, bandType) {
        if (dev <= 0) return `<span class="tag-deviation favorable">No Deviation (0.00%)</span>`;
        const appr = getApproverForDeviation(dev, bandType);
        const cls = appr.toLowerCase();
        return `<span class="tag-deviation ${cls}">-${dev.toFixed(2)}% (${appr})</span>`;
      }

      const roiBadge = getBadge(approval.roiDeviation, "ROI");
      const pfBadge = getBadge(approval.pfDeviation, "PF");

      let bannerTitle = "";
      if (approval.finalApproverKey === "NONE") {
        bannerTitle = `✅ Standard Rate — No Escalation Required`;
      } else {
        bannerTitle = `🛡️ Approval Required: ${approval.finalApproverName}`;
      }

      // DTI Warning block
      const dtiAlertHtml = dti.warning ? `
        <div class="dti-alert">
          <span style="font-size:18px;">⚠️</span>
          <div>
            <strong>High DTI Alert:</strong> The updated Debt-to-Income ratio (${dti.updatedDti}%) 
            exceeds our internal prudent benchmark of ${CONFIG.DTI_LIMIT_PERCENT}%. Special credit risk review recommended.
          </div>
        </div>
      ` : '';

      const cardHtml = `
        <div class="result-card">
          <!-- Verdict Banner -->
          <div class="verdict-banner ${approval.color}">
            <span>${bannerTitle}</span>
          </div>

          <!-- Explanation -->
          <div class="verdict-explanation">
            <strong>Approval Assessment:</strong> ${escapeHtml(approval.explanation)}
          </div>

          <!-- Comparison Table -->
          <div class="comparison-table-wrapper">
            <table class="comparison-table">
              <thead>
                <tr>
                  <th>Parameter</th>
                  <th>Base Policy</th>
                  <th>Requested</th>
                  <th>Deviation & Approver</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td><strong>ROI (% p.a.)</strong></td>
                  <td>${session.baseRoi.toFixed(2)}%</td>
                  <td><strong>${session.requestedRoi.toFixed(2)}%</strong></td>
                  <td>${roiBadge}</td>
                </tr>
                <tr>
                  <td><strong>Processing Fee</strong></td>
                  <td>${session.basePf.toFixed(2)}% (${formatINR(basePfAmount)})</td>
                  <td><strong>${session.requestedPf.toFixed(2)}% (${formatINR(reqPfAmount)})</strong></td>
                  <td>${pfBadge}</td>
                </tr>
                <tr>
                  <td><strong>Monthly EMI</strong></td>
                  <td>${formatINR(baseEmi)}</td>
                  <td><strong>${formatINR(reqEmi)}</strong></td>
                  <td><span class="tag-deviation ${emiDiff >= 0 ? 'favorable' : 'neutral'}">${emiDiff >= 0 ? 'Saves ' + formatINR(emiDiff) + '/m' : '+ ' + formatINR(Math.abs(emiDiff))}</span></td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Financial Impact Grid -->
          <div class="metrics-grid">
            <div class="metric-cell">
              <div class="metric-label">New Monthly EMI</div>
              <div class="metric-value" style="color:#60a5fa;">${formatINR(reqEmi)}</div>
              <div class="metric-sub">${session.tenureMonths} months reducing</div>
            </div>

            <div class="metric-cell">
              <div class="metric-label">Monthly EMI Savings</div>
              <div class="metric-value" style="color:#10b981;">${formatINR(Math.max(0, emiDiff))}</div>
              <div class="metric-sub">${emiDiff > 0 ? 'Lower debt burden' : 'At base rate'}</div>
            </div>

            <div class="metric-cell">
              <div class="metric-label">Upfront PF Amount</div>
              <div class="metric-value">${formatINR(reqPfAmount)}</div>
              <div class="metric-sub">Saves ${formatINR(Math.max(0, pfSavings))}</div>
            </div>

            <div class="metric-cell">
              <div class="metric-label">Updated DTI Ratio</div>
              <div class="metric-value" style="color:${dti.warning ? '#f59e0b' : '#10b981'};">${dti.updatedDti}%</div>
              <div class="metric-sub">Was ${dti.currentDti}%</div>
            </div>
          </div>

          ${dtiAlertHtml}
        </div>
      `;

      appendBotMessage(
        `Here is the complete pricing & approval evaluation for <strong>${escapeHtml(session.customerName)}</strong>:<br>${cardHtml}`,
        [
          { label: "Try different ROI / PF", icon: "✏️", primary: true, value: "re_ask_rates" },
          { label: "New customer", icon: "👤", value: "new_customer" }
        ],
        mascotExpression,
        450
      );
    }

    function reAskRatesOnly() {
      session.step = STEPS.REQUESTED_ROI;
      inputHint.textContent = `Enter requested ROI % p.a. (Base is ${session.baseRoi}%)`;
      userInput.placeholder = `Benchmark is ${session.baseRoi}%, enter new ROI...`;

      appendBotMessage(
        `Let's adjust the proposal for <strong>${escapeHtml(session.customerName)}</strong>.<br>` +
        `All other inputs (Loan: ${formatINR(session.loanAmount)}, ${session.tenureMonths}m, Base: ${session.baseRoi}% / ${session.basePf}%) are safely retained.<br><br>` +
        `What new <strong>Requested ROI (% p.a.)</strong> would you like to evaluate?`,
        [
          { label: `${session.baseRoi}% (Base Rate)`, value: String(session.baseRoi), primary: true },
          { label: `${(session.baseRoi - 1.5).toFixed(1)}% (CBO)`, value: String(session.baseRoi - 1.5) },
          { label: `${(session.baseRoi - 3.0).toFixed(1)}% (COO)`, value: String(session.baseRoi - 3.0) },
          { label: `${(session.baseRoi - 4.5).toFixed(1)}% (CEO)`, value: String(session.baseRoi - 4.5) }
        ],
        "talking"
      );
    }

    // Handle button chip selection for post-results actions
    const originalOnChipSelected = onChipSelected;
    onChipSelected = function(val) {
      if (val === "re_ask_rates") {
        appendUserMessage("Try different ROI / PF");
        reAskRatesOnly();
      } else if (val === "new_customer" || val === "restart") {
        appendUserMessage("New customer");
        restartConversation();
      } else {
        originalOnChipSelected(val);
      }
    };

    /* ==========================================================================
       MOBILE KEYBOARD HANDLING & PWA REGISTRATION
       ========================================================================== */
    // Prevent mobile keyboard from obscuring input area using VisualViewport API
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", () => {
        scrollChatToBottom();
      });
    }

    // Register Service Worker for PWA
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(err => {
          console.log("Service Worker registration skipped:", err);
        });
      });
    }

    // Initialize chatbot on page load
    window.addEventListener("DOMContentLoaded", () => {
      startDialogue();
    });
  </script>
</body>
</html>
