<!DOCTYPE html>
<html lang="en" data-theme="neon">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Lendy 🐱 — 3D Loan Pricing & Approval AI</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#8b5cf6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Lendy is an interactive, mobile-first loan pricing, policy matrix engine, and approval chatbot with an animated 3D pet companion.">

  <style>
    /* ==========================================================================
       VIBRANT MULTI-COLOR THEMES & CSS VARIABLES
       ========================================================================== */
    :root, [data-theme="neon"] {
      --bg-canvas: #090d16;
      --bg-panel: rgba(17, 24, 39, 0.85);
      --bg-card: rgba(30, 41, 59, 0.75);
      --bg-card-hover: rgba(51, 65, 85, 0.85);
      --border-subtle: rgba(255, 255, 255, 0.1);
      --border-glow: rgba(56, 189, 248, 0.4);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;
      --accent-1: #38bdf8;   /* Electric Cyan */
      --accent-2: #818cf8;   /* Indigo Laser */
      --accent-3: #c084fc;   /* Neon Violet */
      --accent-pink: #f472b6;/* Cyber Pink */
      --color-green: #34d399;/* Emerald */
      --color-green-bg: rgba(52, 211, 153, 0.18);
      --color-blue: #60a5fa; /* Vibrant Blue */
      --color-blue-bg: rgba(96, 165, 250, 0.18);
      --color-amber: #fbbf24;/* Solar Amber */
      --color-amber-bg: rgba(251, 191, 36, 0.18);
      --color-red: #f87171;  /* Radiant Coral Red */
      --color-red-bg: rgba(248, 113, 113, 0.18);
      --bubble-user-grad: linear-gradient(135deg, #4f46e5, #9333ea);
      --btn-grad: linear-gradient(135deg, #06b6d4, #8b5cf6);
      --mascot-color: #38bdf8;
      --orb-1: rgba(139, 92, 246, 0.35);
      --orb-2: rgba(6, 182, 212, 0.3);
      --orb-3: rgba(236, 72, 153, 0.25);
    }

    [data-theme="sunset"] {
      --bg-canvas: #0f0b18;
      --bg-panel: rgba(26, 16, 37, 0.85);
      --bg-card: rgba(45, 25, 62, 0.75);
      --bg-card-hover: rgba(67, 38, 92, 0.85);
      --border-subtle: rgba(255, 255, 255, 0.12);
      --border-glow: rgba(249, 115, 22, 0.45);
      --text-main: #fff7ed;
      --text-muted: #fed7aa;
      --text-subtle: #9a6850;
      --accent-1: #fb923c;   /* Fiery Orange */
      --accent-2: #f43f5e;   /* Rose Coral */
      --accent-3: #fbbf24;   /* Golden Amber */
      --accent-pink: #ec4899;
      --color-green: #10b981;
      --color-green-bg: rgba(16, 185, 129, 0.2);
      --color-blue: #38bdf8;
      --color-blue-bg: rgba(56, 189, 248, 0.2);
      --color-amber: #f59e0b;
      --color-amber-bg: rgba(245, 158, 11, 0.2);
      --color-red: #ef4444;
      --color-red-bg: rgba(239, 68, 68, 0.2);
      --bubble-user-grad: linear-gradient(135deg, #ea580c, #db2777);
      --btn-grad: linear-gradient(135deg, #f59e0b, #e11d48);
      --mascot-color: #fb923c;
      --orb-1: rgba(249, 115, 22, 0.35);
      --orb-2: rgba(219, 39, 119, 0.3);
      --orb-3: rgba(245, 158, 11, 0.25);
    }

    [data-theme="emerald"] {
      --bg-canvas: #061412;
      --bg-panel: rgba(10, 31, 28, 0.85);
      --bg-card: rgba(18, 53, 47, 0.75);
      --bg-card-hover: rgba(27, 77, 68, 0.85);
      --border-subtle: rgba(255, 255, 255, 0.1);
      --border-glow: rgba(52, 211, 153, 0.4);
      --text-main: #f0fdf4;
      --text-muted: #a7f3d0;
      --text-subtle: #4d7c6f;
      --accent-1: #34d399;   /* Mint Green */
      --accent-2: #2dd4bf;   /* Teal */
      --accent-3: #38bdf8;   /* Cyan */
      --accent-pink: #f472b6;
      --color-green: #34d399;
      --color-green-bg: rgba(52, 211, 153, 0.2);
      --color-blue: #60a5fa;
      --color-blue-bg: rgba(96, 165, 250, 0.2);
      --color-amber: #fbbf24;
      --color-amber-bg: rgba(251, 191, 36, 0.2);
      --color-red: #f87171;
      --color-red-bg: rgba(248, 113, 113, 0.2);
      --bubble-user-grad: linear-gradient(135deg, #059669, #0284c7);
      --btn-grad: linear-gradient(135deg, #10b981, #06b6d4);
      --mascot-color: #34d399;
      --orb-1: rgba(16, 185, 129, 0.35);
      --orb-2: rgba(6, 182, 212, 0.3);
      --orb-3: rgba(20, 184, 166, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-canvas);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      position: relative;
    }

    body {
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Ambient animated multi-color backdrop orbs */
    .ambient-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(85px);
      opacity: 0.6;
      animation: float-orb 14s infinite alternate ease-in-out;
    }

    .orb-1 { width: 340px; height: 340px; background: var(--orb-1); top: -80px; left: -60px; animation-duration: 12s; }
    .orb-2 { width: 380px; height: 380px; background: var(--orb-2); bottom: 10%; right: -80px; animation-duration: 16s; }
    .orb-3 { width: 300px; height: 300px; background: var(--orb-3); top: 40%; left: 30%; animation-duration: 14s; }

    @keyframes float-orb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 35px) scale(1.15); }
    }

    /* ==========================================================================
       HEADER & NAVIGATION
       ========================================================================== */
    .app-header {
      height: 68px;
      background: var(--bg-panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      z-index: 30;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.01em;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-subtitle {
      font-size: 11.5px;
      color: var(--text-muted);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background-color: var(--color-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--color-green);
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-action-btn {
      min-height: 40px;
      min-width: 40px;
      padding: 0 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 9999px;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }

    .icon-action-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-glow);
      transform: translateY(-1px);
    }

    .icon-action-btn:active {
      transform: scale(0.96);
    }

    /* ==========================================================================
       CHAT STREAM
       ========================================================================== */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px 16px 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
      position: relative;
      z-index: 10;
    }

    .message-row {
      display: flex;
      gap: 10px;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      opacity: 0;
      transform: translateY(10px);
      animation: message-in 0.28s ease-out forwards;
    }

    @keyframes message-in {
      to { opacity: 1; transform: translateY(0); }
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .bot-avatar-badge {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--btn-grad);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(6, 182, 212, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .message-bubble {
      padding: 14px 18px;
      border-radius: 16px;
      line-height: 1.55;
      font-size: 14.5px;
      position: relative;
      word-break: break-word;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .message-row.bot .message-bubble {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      border-top-left-radius: 4px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .message-row.user .message-bubble {
      background: var(--bubble-user-grad);
      color: #ffffff;
      border-top-right-radius: 4px;
      box-shadow: 0 4px 16px rgba(139, 92, 246, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-weight: 500;
    }

    /* Typing Dots */
    .typing-dots {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 2px;
    }

    .dot-pulse {
      width: 8px;
      height: 8px;
      background: var(--accent-1);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--accent-1);
      animation: dot-glow 1.4s infinite ease-in-out both;
    }

    .dot-pulse:nth-child(1) { animation-delay: -0.32s; }
    .dot-pulse:nth-child(2) { animation-delay: -0.16s; }

    @keyframes dot-glow {
      0%, 80%, 100% { transform: scale(0.4); opacity: 0.3; }
      40% { transform: scale(1.1); opacity: 1; }
    }

    /* ==========================================================================
       ENHANCED VERDICT RESULT CARD
       ========================================================================== */
    .result-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      overflow: hidden;
      margin-top: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }

    .verdict-banner {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 15.5px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .verdict-banner.green {
      background: var(--color-green-bg);
      color: var(--color-green);
      border-bottom-color: rgba(52, 211, 153, 0.4);
      box-shadow: inset 0 0 20px rgba(52, 211, 153, 0.1);
    }

    .verdict-banner.blue {
      background: var(--color-blue-bg);
      color: var(--color-blue);
      border-bottom-color: rgba(96, 165, 250, 0.4);
      box-shadow: inset 0 0 20px rgba(96, 165, 250, 0.1);
    }

    .verdict-banner.amber {
      background: var(--color-amber-bg);
      color: var(--color-amber);
      border-bottom-color: rgba(251, 191, 36, 0.4);
      box-shadow: inset 0 0 20px rgba(251, 191, 36, 0.1);
    }

    .verdict-banner.red {
      background: var(--color-red-bg);
      color: var(--color-red);
      border-bottom-color: rgba(248, 113, 113, 0.4);
      box-shadow: inset 0 0 25px rgba(248, 113, 113, 0.2);
    }

    .verdict-explanation {
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.02);
      font-size: 13.5px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-subtle);
      line-height: 1.6;
    }

    .verdict-explanation strong {
      color: var(--text-main);
    }

    .floor-alert-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      background: var(--color-red-bg);
      color: var(--color-red);
      border: 1px solid rgba(248, 113, 113, 0.4);
      margin-bottom: 6px;
    }

    .comparison-table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    .comparison-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }

    .comparison-table th, 
    .comparison-table td {
      padding: 11px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border-subtle);
    }

    .comparison-table th {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.05em;
    }

    .comparison-table td:last-child,
    .comparison-table th:last-child {
      text-align: right;
    }

    .pill-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
    }

    .pill-badge.favorable { background: var(--color-green-bg); color: var(--color-green); border: 1px solid rgba(52, 211, 153, 0.3); }
    .pill-badge.cbo { background: var(--color-blue-bg); color: var(--color-blue); border: 1px solid rgba(96, 165, 250, 0.3); }
    .pill-badge.coo { background: var(--color-amber-bg); color: var(--color-amber); border: 1px solid rgba(251, 191, 36, 0.3); }
    .pill-badge.ceo { background: var(--color-red-bg); color: var(--color-red); border: 1px solid rgba(248, 113, 113, 0.3); }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 14px;
      background: rgba(0, 0, 0, 0.2);
    }

    @media (min-width: 600px) {
      .metrics-grid { grid-template-columns: repeat(4, 1fr); }
    }

    .metric-cell {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 10px 14px;
      transition: transform 0.2s;
    }

    .metric-cell:hover {
      transform: translateY(-2px);
    }

    .metric-title {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .metric-number {
      font-size: 16px;
      font-weight: 800;
      margin: 3px 0;
      color: var(--text-main);
    }

    .metric-caption {
      font-size: 11px;
      color: var(--text-subtle);
    }

    /* DTI Warning Banner */
    .dti-alert-box {
      margin: 12px 14px;
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--color-amber-bg);
      border: 1px solid rgba(251, 191, 36, 0.4);
      color: #fef3c7;
      font-size: 13px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(251, 191, 36, 0.15);
    }

    /* ==========================================================================
       TAPPABLE CHIPS AREA
       ========================================================================== */
    .chips-area {
      padding: 8px 16px 12px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-start;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      z-index: 20;
    }

    .chip-btn {
      min-height: 44px;
      padding: 10px 16px;
      background: var(--bg-card);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border-subtle);
      border-radius: 9999px;
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .chip-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-glow);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(6, 182, 212, 0.25);
    }

    .chip-btn:active {
      transform: scale(0.96);
    }

    .chip-btn.glow-primary {
      background: var(--btn-grad);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 4px 16px rgba(139, 92, 246, 0.4);
    }

    /* ==========================================================================
       3D / 4D INTERACTIVE PET COMPANION NEAR SEND BUTTON
       ========================================================================== */
    .input-bar-container {
      background: var(--bg-panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-subtle);
      padding: 10px 16px;
      flex-shrink: 0;
      z-index: 30;
      position: relative;
    }

    .input-row-wrapper {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      position: relative;
    }

    /* 3D Interactive Mascot Container Anchored Near Send Button */
    .pet-3d-anchor {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 700px;
      cursor: pointer;
    }

    .pet-3d-box {
      width: 58px;
      height: 58px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.5));
    }

    /* 3D Cat Mascot Vector */
    .pet-svg {
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
    }

    /* 3D Wagging Tail */
    @keyframes tail-wag-3d {
      0%, 100% { transform: rotate(0deg) skewX(0deg); }
      50% { transform: rotate(18deg) skewX(8deg); }
    }
    .pet-tail {
      transform-origin: 22px 52px;
      animation: tail-wag-3d 1.6s infinite ease-in-out;
    }

    /* 3D Ears Twitch */
    @keyframes ear-twitch {
      0%, 90%, 100% { transform: rotate(0deg); }
      93% { transform: rotate(-4deg); }
      96% { transform: rotate(3deg); }
    }
    .pet-ears {
      transform-origin: 30px 20px;
      animation: ear-twitch 5s infinite;
    }

    /* 3D Bounce Animation */
    @keyframes pet-float-3d {
      0%, 100% { transform: translateY(0px) rotateX(4deg); }
      50% { transform: translateY(-3px) rotateX(-2deg); }
    }
    .pet-floating {
      animation: pet-float-3d 3.2s infinite ease-in-out;
    }

    /* Speech Bubble from Pet */
    .pet-speech-bubble {
      position: absolute;
      bottom: 64px;
      right: 0;
      background: var(--bg-card);
      border: 1px solid var(--border-glow);
      padding: 5px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-1);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transform: translateY(6px) scale(0.9);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      z-index: 50;
    }

    .pet-speech-bubble.active {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .pet-speech-bubble::after {
      content: "";
      position: absolute;
      bottom: -6px;
      right: 22px;
      border-width: 6px 6px 0;
      border-style: solid;
      border-color: var(--border-glow) transparent transparent;
    }

    .input-field-wrapper {
      flex: 1;
      position: relative;
    }

    .chat-input {
      width: 100%;
      min-height: 48px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 9999px;
      padding: 12px 20px;
      color: var(--text-main);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .chat-input:focus {
      border-color: var(--accent-1);
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.25);
    }

    .chat-input::placeholder {
      color: var(--text-subtle);
    }

    .send-btn-action {
      min-width: 48px;
      min-height: 48px;
      width: 48px;
      height: 48px;
      background: var(--btn-grad);
      color: #ffffff;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;

    function deriveTicketSize(product, loanAmount) {
      if (product === "Regular Secured Business Loan") {
        return loanAmount <= 500000.0 ? "Upto 5 Lacs" : "Above 5 Lacs";
      }
      return "All Ticket Size";
    }

    function lookupBaseRates(product, ticketSize, incomeProgram, propertyType, bureau) {
      const match = CONFIG.MATRIX.find(row => 
        row.product === product &&
        row.ticket === ticketSize &&
        row.income === incomeProgram &&
        row.property === propertyType &&
        row.bureau === bureau
      );
      if (match) return { baseRoi: match.baseRoi, basePf: match.basePf };
      return null;
    }

    function getApproverForDeviation(deviation, bandType) {
      const eps = CONFIG.ROUNDING_TOLERANCE;
      if (deviation <= eps) return "NONE";
      const bands = CONFIG.BANDS[bandType];
      for (let i = 0; i < bands.length; i++) {
        if (deviation <= bands[i].max + eps) return bands[i].approver;
      }
      return "CEO";
    }

    function determineFinalApproval(baseRoi, reqRoi, basePf, reqPf) {
      const eps = CONFIG.ROUNDING_TOLERANCE;
      const roiDeviation = parseFloat((baseRoi - reqRoi).toFixed(4));
      const pfDeviation = parseFloat((basePf - reqPf).toFixed(4));

      let roiApprover = getApproverForDeviation(roiDeviation, "ROI");
      let pfApprover = getApproverForDeviation(pfDeviation, "PF");

      // Mandatory Absolute Policy Floors:
      // 1. Requested ROI < 15.0% -> Mandates CEO Approval
      // 2. Requested PF < 1.50%  -> Mandates CEO Approval
      const roiFloorBreached = reqRoi < (CONFIG.ROI_FLOOR_PERCENT - eps);
      const pfFloorBreached = reqPf < (CONFIG.PF_FLOOR_PERCENT - eps);

      if (roiFloorBreached) roiApprover = "CEO";
      if (pfFloorBreached) pfApprover = "CEO";

      const levelRoi = CONFIG.APPROVERS[roiApprover].level;
      const levelPf = CONFIG.APPROVERS[pfApprover].level;
      const finalKey = levelRoi >= levelPf ? roiApprover : pfApprover;
      const approverInfo = CONFIG.APPROVERS[finalKey];

      let explanation = "";
      const reasons = [];

      if (roiFloorBreached) {
        reasons.push(`⚠️ Requested ROI (${reqRoi.toFixed(2)}%) is below the absolute 15.00% floor, mandating CEO Approval`);
      } else if (roiApprover !== "NONE") {
        reasons.push(`ROI discount of ${roiDeviation.toFixed(2)}% requires ${CONFIG.APPROVERS[roiApprover].name}`);
      }

      if (pfFloorBreached) {
        reasons.push(`⚠️ Requested PF (${reqPf.toFixed(2)}%) is below the absolute 1.50% floor, mandating CEO Approval`);
      } else if (pfApprover !== "NONE") {
        reasons.push(`PF waiver/discount of ${pfDeviation.toFixed(2)}% requires ${CONFIG.APPROVERS[pfApprover].name}`);
      }

      if (reasons.length === 0) {
        explanation = "Requested rates match or exceed benchmark requirements. Standard processing without deviation.";
      } else {
        explanation = reasons.join(" • ") + `. Final authority governed by: <strong>${approverInfo.name} (${approverInfo.title})</strong>.`;
      }

      return {
        roiDeviation,
        pfDeviation,
        roiApprover,
        pfApprover,
        roiFloorBreached,
        pfFloorBreached,
        finalApproverKey: finalKey,
        finalApproverName: approverInfo.name,
        color: approverInfo.color,
        requiresApproval: finalKey !== "NONE",
        explanation
      };
    }

    function calculateReducingEMI(principal, annualRatePct, tenureMonths) {
      if (tenureMonths <= 0) return 0;
      if (annualRatePct <= 0) return principal / tenureMonths;
      const r = annualRatePct / 12.0 / 100.0;
      const factor = Math.pow(1.0 + r, tenureMonths);
      return (principal * r * factor) / (factor - 1.0);
    }

    function calculateDTI(existingEmis, newEmi, monthlyIncome) {
      if (monthlyIncome <= 0) return { currentDti: 0, updatedDti: 0, warning: false };
      const currentDti = (existingEmis / monthlyIncome) * 100.0;
      const updatedDti = ((existingEmis + newEmi) / monthlyIncome) * 100.0;
      const warning = updatedDti > CONFIG.DTI_LIMIT_PERCENT;
      return {
        currentDti: parseFloat(currentDti.toFixed(2)),
        updatedDti: parseFloat(updatedDti.toFixed(2)),
        warning
      };
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function formatINR(number) {
      if (isNaN(number)) return "₹0";
      return "₹" + Math.round(number).toLocaleString("en-IN");
    }

    function parseLoanAmount(text) {
      if (!text) return null;
      let clean = text.toLowerCase().trim().replace(/,/g, "").replace(/₹/g, "").replace(/rs\.?/g, "");
      if (clean.includes("cr") || clean.includes("crore")) {
        const num = parseFloat(clean.replace(/crores?|cr/g, "").trim());
        return isNaN(num) || num <= 0 ? null : num * 10000000;
      }
      if (clean.includes("lakh") || clean.includes("lac")) {
        const num = parseFloat(clean.replace(/lakhs?|lacs?|lac/g, "").trim());
        return isNaN(num) || num <= 0 ? null : num * 100000;
      }
      if (clean.includes("k")) {
        const num = parseFloat(clean.replace(/k/g, "").trim());
        return isNaN(num) || num <= 0 ? null : num * 1000;
      }
      const num = parseFloat(clean);
      return isNaN(num) || num <= 0 ? null : num;
    }

    function parseTenure(text) {
      if (!text) return null;
      let clean = text.toLowerCase().trim().replace(/,/g, "");
      if (clean.includes("year") || clean.includes("yr") || clean.includes("y")) {
        const num = parseFloat(clean.replace(/years?|yrs?|y/g, "").trim());
        if (isNaN(num) || num <= 0) return null;
        const months = Math.round(num * 12);
        return months >= 3 && months <= 360 ? months : null;
      }
      if (clean.includes("month") || clean.includes("m")) {
        const num = parseFloat(clean.replace(/months?|m/g, "").trim());
        if (isNaN(num) || num <= 0) return null;
        return num >= 3 && num <= 360 ? Math.round(num) : null;
      }
      const num = parseFloat(clean);
      if (isNaN(num) || num < 3 || num > 360) return null;
      return Math.round(num);
    }

    function parseNumber(text) {
      if (!text) return null;
      let clean = text.toLowerCase().trim().replace(/,/g, "").replace(/₹/g, "").replace(/rs\.?/g, "");
      if (["nil", "none", "zero", "0", "na", "no"].includes(clean)) return 0.0;
      return parseLoanAmount(clean);
    }

    /* ==========================================================================
       3D / 4D INTERACTIVE PET DYNAMICS & MOVEMENT
       ========================================================================== */
    const petBox = document.getElementById("petBox");
    const petEyeL = document.getElementById("petEyeL");
    const petEyeR = document.getElementById("petEyeR");
    const petPupilL = document.getElementById("petPupilL");
    const petPupilR = document.getElementById("petPupilR");
    const petMouth = document.getElementById("petMouth");
    const petBubble = document.getElementById("petBubble");

    // Track cursor for 3D Head and Eye parallax
    window.addEventListener("mousemove", (e) => {
      if (!petBox) return;
      const rect = petBox.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const deltaX = (e.clientX - centerX) / (window.innerWidth / 2);
      const deltaY = (e.clientY - centerY) / (window.innerHeight / 2);

      const rotateY = Math.max(-25, Math.min(25, deltaX * 25));
      const rotateX = Math.max(-20, Math.min(20, -deltaY * 20));

      petBox.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1)`;

      // Pupil parallax offset
      if (petPupilL && petPupilR) {
        const pX = Math.max(-2, Math.min(2, deltaX * 2.5));
        const pY = Math.max(-2, Math.min(2, deltaY * 2.5));
        petPupilL.setAttribute("cx", 30 + pX);
        petPupilL.setAttribute("cy", 25.5 + pY);
        petPupilR.setAttribute("cx", 42 + pX);
        petPupilR.setAttribute("cy", 25.5 + pY);
      }
    });

          petEyeR.setAttribute("rx", "3.5"); petEyeR.setAttribute("ry", "4.5");
          petMouth.setAttribute("d", "M32,31 Q35,37 38,31");

        case "thinking":

          petEyeR.setAttribute("rx", "3.0"); petEyeR.setAttribute("ry", "3.0");
          petMouth.setAttribute("d", "M33,33 L37,33");
          break;
        case "surprised":
          petEyeL.setAttribute("rx", "4.8"); petEyeL.setAttribute("ry", "5.2");
          petEyeR.setAttribute("rx", "4.8"); petEyeR.setAttribute("ry", "5.2");
          petMouth.setAttribute("d", "M33,33 A2,2 0 1 0 37,33 A2,2 0 1 0 33,33");

    /* ==========================================================================

    const inputHint = document.getElementById("inputHint");

      customerName: "", product: "", incomeProgram: "", propertyType: "",
      bureau: "", loanAmount: 0, ticketSize: "", tenureMonths: 0,
      incomeFrequency: "Monthly", monthlyIncome: 0, existingEmis: 0,
      baseRoi: 0, basePf: 0, requestedRoi: 0, requestedPf: 0, step: "CUSTOMER_NAME"
    };

    const STEPS = {
      CUSTOMER_NAME: "CUSTOMER_NAME", PRODUCT: "PRODUCT", INCOME_PROGRAM: "INCOME_PROGRAM",
      PROPERTY_TYPE: "PROPERTY_TYPE", BUREAU: "BUREAU", LOAN_AMOUNT: "LOAN_AMOUNT",
      TENURE: "TENURE", INCOME_FREQ: "INCOME_FREQ", INCOME_AMOUNT: "INCOME_AMOUNT",
      EXISTING_EMIS: "EXISTING_EMIS", REQUESTED_ROI: "REQUESTED_ROI", REQUESTED_PF: "REQUESTED_PF",
      COMPLETED: "COMPLETED"
    };

    function scrollChatToBottom() {
      requestAnimationFrame(() => { chatContainer.scrollTop = chatContainer.scrollHeight; });
    }

    function appendUserMessage(text) {
      const row = document.createElement("div");
      row.className = "message-row user";
      row.innerHTML = `<div class="message-bubble">${escapeHtml(text)}</div>`;
      chatContainer.appendChild(row);
      scrollChatToBottom();
    }

    function appendBotMessage(htmlContent, chips = [], petMood = "idle", delayMs = 380) {
      const currentToken = conversationToken;
      setPetExpression("thinking");

      const typingRow = document.createElement("div");
      typingRow.className = "message-row bot typing-row";
      typingRow.innerHTML = `
        <div class="bot-avatar-badge">🐱</div>
        <div class="message-bubble">
          <div class="typing-dots">
            <span class="dot-pulse"></span><span class="dot-pulse"></span><span class="dot-pulse"></span>
          </div>
        </div>`;
      chatContainer.appendChild(typingRow);
      scrollChatToBottom();

      userInput.disabled = true;
      sendBtn.disabled = true;
      chipsArea.innerHTML = "";

      setTimeout(() => {
        if (currentToken !== conversationToken) return;
        typingRow.remove();
        setPetExpression("talking");

        const msgRow = document.createElement("div");
        msgRow.className = "message-row bot";
        msgRow.innerHTML = `
          <div class="bot-avatar-badge">🐱</div>
          <div class="message-bubble">${htmlContent}</div>`;
        chatContainer.appendChild(msgRow);

        renderChips(chips);
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
        scrollChatToBottom();

        setTimeout(() => {
          if (currentToken === conversationToken) setPetExpression(petMood);
        }, 500);
      }, delayMs);
    }

    function renderChips(chips) {
      chipsArea.innerHTML = "";
      if (!chips || chips.length === 0) {
        chipsArea.style.display = "none";
        return;
      }
      chipsArea.style.display = "flex";
      chips.forEach(chip => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `chip-btn ${chip.primary ? 'glow-primary' : ''}`;
        btn.innerHTML = `${chip.icon ? chip.icon + ' ' : ''}<span>${escapeHtml(chip.label)}</span>`;
        btn.onclick = () => onChipSelected(chip.value !== undefined ? chip.value : chip.label);
        chipsArea.appendChild(btn);
      });
    }

    function onChipSelected(value) { handleStepInput(value); }
    function submitInput() {
      const text = userInput.value.trim();
      if (!text) return;
      handleStepInput(text);
      userInput.value = "";
    }

    function startDialogue() {
      session = {
        customerName: "", product: "", incomeProgram: "", propertyType: "",
        bureau: "", loanAmount: 0, ticketSize: "", tenureMonths: 0,
        incomeFrequency: "Monthly", monthlyIncome: 0, existingEmis: 0,

        `<strong>To begin, what is the customer's full name?</strong>`,

      showPetBubble("Restarting session! 🚀", 1800);

    function handleStepInput(inputStr) {
      const clean = String(inputStr).trim();
      if (!clean) return;
      appendUserMessage(clean);

      switch (session.step) {
        case STEPS.CUSTOMER_NAME:
          session.customerName = clean;
          session.step = STEPS.PRODUCT;
          inputHint.textContent = "Select loan product from chips below";
          userInput.placeholder = "Or type product name...";
          appendBotMessage(
            `Pleasure to assist you, <strong>${escapeHtml(session.customerName)}</strong>! ✨<br>Which <strong>Loan Product</strong> are we pricing today?`,
            [
              { label: "Regular Secured Business Loan", icon: "🏢", primary: true },
              { label: "Secured Working Capital Term Loan", icon: "💼" },
              { label: "Hypothecation Loans", icon: "🚗" }
            ], "talking"
          );
          break;

        case STEPS.PRODUCT:
          const validProducts = ["Regular Secured Business Loan", "Secured Working Capital Term Loan", "Hypothecation Loans"];
          const matchedP = validProducts.find(p => p.toLowerCase() === clean.toLowerCase() || clean.toLowerCase().includes(p.toLowerCase().substring(0, 10)));
          if (!matchedP) {
            appendBotMessage(`Please pick one of our standard loan products:`, validProducts.map(p => ({ label: p })), "worried");
            return;
          }
          session.product = matchedP;
          session.step = STEPS.INCOME_PROGRAM;
          inputHint.textContent = "Select customer income program";
          userInput.placeholder = "Select income program...";
          appendBotMessage(
            `Product chosen: <strong>${session.product}</strong>. 👍<br><br>Under which <strong>Income Program</strong> is this loan assessed?`,
            [
              { label: "Documented Income Program", icon: "📑", primary: true },
              { label: "Assessed Income Program", icon: "🔍" },
              { label: "Hybrid Income Program", icon: "⚡" },
              { label: "Semi Documented Income Program", icon: "📂" }
            ], "talking"
          );
          break;

        case STEPS.INCOME_PROGRAM:
          const programs = ["Documented Income Program", "Assessed Income Program", "Hybrid Income Program", "Semi Documented Income Program"];
          const matchedProg = programs.find(p => p.toLowerCase() === clean.toLowerCase() || p.toLowerCase().startsWith(clean.toLowerCase()));
          if (!matchedProg) {
            appendBotMessage(`Kindly select one of the four recognized income programs:`, programs.map(p => ({ label: p })), "worried");
            return;
          }
          session.incomeProgram = matchedProg;

          if (session.product === "Hypothecation Loans") {
            session.propertyType = "NA";
            session.step = STEPS.BUREAU;
            inputHint.textContent = "Select Bureau category";
            userInput.placeholder = "Select bureau score...";
            appendBotMessage(
              `⚡ For <strong>Hypothecation Loans</strong>, Property Type is not applicable (NA) and skipped automatically!<br><br>What is the borrower's <strong>Bureau Category</strong>?`,
              [{ label: ">=700 or NTC", icon: "⭐", primary: true }, { label: "<700", icon: "📊" }], "happy"
            );
          } else {
            session.step = STEPS.PROPERTY_TYPE;
            inputHint.textContent = "Select Property Type";
            userInput.placeholder = "Select property type...";
            appendBotMessage(
              `Income program recorded: <strong>${session.incomeProgram}</strong>. 📋<br><br>What is the <strong>Property Type</strong> mortgaged?`,
              [{ label: "SORP", icon: "🏠", primary: true }, { label: "Other", icon: "🏢" }], "talking"
            );
          }
          break;

        case STEPS.PROPERTY_TYPE:
          const props = ["SORP", "Other"];
          const matchedProp = props.find(p => p.toLowerCase() === clean.toLowerCase());
          if (!matchedProp) {
            appendBotMessage(`Please select whether the property is <strong>SORP</strong> or <strong>Other</strong>:`, props.map(p => ({ label: p })), "worried");
            return;
          }
          session.propertyType = matchedProp;
          session.step = STEPS.BUREAU;
          inputHint.textContent = "Select Bureau category";
          userInput.placeholder = "Select bureau score...";
          appendBotMessage(
            `Property recorded as <strong>${session.propertyType}</strong>.<br><br>Now, what is the borrower's <strong>Bureau Category</strong>?`,
            [{ label: ">=700 or NTC", icon: "⭐", primary: true }, { label: "<700", icon: "📊" }], "talking"
          );
          break;

        case STEPS.BUREAU:
          let matchedB = null;
          if (clean.includes(">=700") || clean.toLowerCase().includes("ntc") || clean.includes("700+")) matchedB = ">=700 or NTC";
          else if (clean.includes("<700") || clean.toLowerCase().includes("below")) matchedB = "<700";

          if (!matchedB) {
            appendBotMessage(`Please select bureau category:`, [{ label: ">=700 or NTC", icon: "⭐" }, { label: "<700", icon: "📊" }], "worried");
            return;
          }
          session.bureau = matchedB;
          session.step = STEPS.LOAN_AMOUNT;
          inputHint.textContent = "Enter loan amount (e.g. 5 lakh, 10,00,000, 1.2 cr)";
          userInput.placeholder = "e.g. 10 Lakhs, 10,00,000, 500000...";
          appendBotMessage(
            `Bureau recorded: <strong>${session.bureau}</strong>. 📈<br><br>What is the <strong>Loan Amount</strong> requested? (Accepts <em>"10 lakh"</em>, <em>"10,00,000"</em>, <em>"1.2 cr"</em>)`,
            [
              { label: "5 Lakhs", value: "500000" },
              { label: "10 Lakhs", value: "1000000", primary: true },
              { label: "25 Lakhs", value: "2500000" },
              { label: "50 Lakhs", value: "5000000" }
            ], "talking"
          );
          break;

        case STEPS.LOAN_AMOUNT:
          const parsedAmount = parseLoanAmount(clean);
          if (!parsedAmount || parsedAmount <= 0) {
            appendBotMessage(`Please enter a valid loan amount like <strong>5 lakh</strong>, <strong>10,00,000</strong>, or <strong>1.5 cr</strong>:`,
              [{ label: "5 Lakhs", value: "500000" }, { label: "10 Lakhs", value: "1000000" }, { label: "25 Lakhs", value: "2500000" }], "worried"
            );
            return;
          }
          session.loanAmount = parsedAmount;
          session.ticketSize = deriveTicketSize(session.product, session.loanAmount);
          session.step = STEPS.TENURE;
          inputHint.textContent = "Enter loan tenure (e.g. 36 months, 5 years)";
          userInput.placeholder = "e.g. 60 months, 5 years, 36...";
          appendBotMessage(
            `Loan Amount: <strong>${formatINR(session.loanAmount)}</strong>.<br>Derived Ticket Size: <strong>${session.ticketSize}</strong>. 🏷️<br><br>What is the proposed <strong>Loan Tenure</strong>? (3 - 360 months)`,
            [
              { label: "3 Years (36m)", value: "36 months" },
              { label: "5 Years (60m)", value: "60 months", primary: true },
              { label: "7 Years (84m)", value: "84 months" },
              { label: "10 Years (120m)", value: "120 months" }
            ], "talking"
          );
          break;

        case STEPS.TENURE:
          const parsedMonths = parseTenure(clean);
          if (!parsedMonths) {
            appendBotMessage(`Please enter tenure between <strong>3 and 360 months</strong> (e.g. <em>"60 months"</em> or <em>"5 years"</em>):`,
              [{ label: "36 months" }, { label: "60 months", primary: true }, { label: "84 months" }, { label: "120 months" }], "worried"
            );
            return;
          }
          session.tenureMonths = parsedMonths;
          session.step = STEPS.INCOME_FREQ;
          inputHint.textContent = "Select Monthly or Annual income";
          userInput.placeholder = "Select income frequency...";
          appendBotMessage(
            `Tenure: <strong>${session.tenureMonths} months (${(session.tenureMonths / 12).toFixed(1)} years)</strong>. ⏳<br><br>How is the customer's income declared?`,
            [{ label: "Monthly Income", value: "Monthly", icon: "📅", primary: true }, { label: "Annual Income", value: "Annual", icon: "📊" }], "talking"
          );
          break;

        case STEPS.INCOME_FREQ:
          const freq = clean.toLowerCase().includes("ann") ? "Annual" : "Monthly";
          session.incomeFrequency = freq;
          session.step = STEPS.INCOME_AMOUNT;
          inputHint.textContent = `Enter ${freq.toLowerCase()} income amount`;
          userInput.placeholder = freq === "Annual" ? "e.g. 12 lakh, 12,00,000..." : "e.g. 80,000, 1 lakh...";
          appendBotMessage(
            `Selected <strong>${freq} Income</strong>. What is the customer's gross ${freq.toLowerCase()} earnings?`,
            freq === "Annual" ? [
              { label: "₹6 Lakhs", value: "600000" },
              { label: "₹12 Lakhs", value: "1200000", primary: true },
              { label: "₹24 Lakhs", value: "2400000" }
            ] : [
              { label: "₹50,000", value: "50000" },
              { label: "₹80,000", value: "80000", primary: true },
              { label: "₹1,50,000", value: "150000" }
            ], "talking"
          );
          break;

        case STEPS.INCOME_AMOUNT:
          const parsedInc = parseNumber(clean);
          if (!parsedInc || parsedInc <= 0) {
            appendBotMessage(`Please enter a valid positive income (e.g. <em>"80,000"</em> or <em>"12 lakh"</em>):`, [], "worried");
            return;
          }
          session.monthlyIncome = session.incomeFrequency === "Annual" ? parsedInc / 12.0 : parsedInc;
          session.step = STEPS.EXISTING_EMIS;
          inputHint.textContent = "Enter total existing monthly EMIs (0 if none)";
          userInput.placeholder = "e.g. 20,000 or 0...";
          appendBotMessage(
            `Normalized Monthly Income: <strong>${formatINR(session.monthlyIncome)}/month</strong>. 💼<br><br>What are the borrower's <strong>total existing monthly EMIs / debt obligations</strong>? (Enter <strong>0</strong> if none)`,
            [
              { label: "0 (No obligations)", value: "0", primary: true },
              { label: "₹10,000", value: "10000" },
              { label: "₹20,000", value: "20000" },
              { label: "₹35,000", value: "35000" }
            ], "talking"
          );
          break;

        case STEPS.EXISTING_EMIS:
          const parsedEmis = parseNumber(clean);
          if (parsedEmis === null || parsedEmis < 0) {
            appendBotMessage(`Please enter 0 or positive existing EMIs:`, [{ label: "0", value: "0" }], "worried");
            return;
          }
          session.existingEmis = parsedEmis;

          const baseRates = lookupBaseRates(session.product, session.ticketSize, session.incomeProgram, session.propertyType, session.bureau);
          if (!baseRates) {
            appendBotMessage(
              `⚠️ <strong>Policy Matrix Notice:</strong> No standard rate entry exists for this exact parameter combination.<br>` +
              `This exception requires <strong>CEO / Credit Committee Approval</strong>.`,
              [{ label: "Start Over", value: "restart" }], "worried"
            );
            return;
          }

          session.baseRoi = baseRates.baseRoi;
          session.basePf = baseRates.basePf;
          session.step = STEPS.REQUESTED_ROI;
          inputHint.textContent = "Enter requested ROI % p.a. (0 - 60)";
          userInput.placeholder = `Benchmark is ${session.baseRoi}%, enter requested ROI...`;

          appendBotMessage(
            `🎉 <strong>Policy Benchmark Found!</strong><br><br>` +
            `Standard benchmark rates for this profile:<br>` +
            `• <strong>Base ROI:</strong> <span style="color:var(--accent-1); font-weight:800;">${session.baseRoi.toFixed(2)}% p.a.</span><br>` +
            `• <strong>Base Processing Fee:</strong> <span style="color:var(--accent-pink); font-weight:800;">${session.basePf.toFixed(2)}%</span><br><br>` +
            `<em>Note: Per credit policy, any Requested ROI &lt; 15% requires mandatory CEO Approval.</em><br><br>` +
            `What <strong>Requested ROI (% p.a.)</strong> would you like to evaluate?`,
            [
              { label: `${session.baseRoi}% (Base Rate)`, value: String(session.baseRoi), primary: true },
              { label: `${(session.baseRoi - 1.5).toFixed(1)}% (CBO)`, value: String(session.baseRoi - 1.5) },
              { label: `${(session.baseRoi - 3.0).toFixed(1)}% (COO)`, value: String(session.baseRoi - 3.0) },
              { label: `14.5% (< 15% CEO Floor)`, value: "14.5" }
            ], "surprised"
          );
          break;

        case STEPS.REQUESTED_ROI:
          const numRoi = parseFloat(clean.replace(/%/g, ""));
          if (isNaN(numRoi) || numRoi < 0 || numRoi > 60) {
            appendBotMessage(`Please enter a realistic requested annual ROI between <strong>0% and 60%</strong>:`, [{ label: `${session.baseRoi}%`, value: String(session.baseRoi) }], "worried");
            return;
          }
          session.requestedRoi = numRoi;
          session.step = STEPS.REQUESTED_PF;
          inputHint.textContent = "Enter requested PF % (0 - 15)";
          userInput.placeholder = `Benchmark is ${session.basePf}%, enter requested PF...`;
          appendBotMessage(
            `Requested ROI recorded: <strong>${session.requestedRoi.toFixed(2)}% p.a.</strong> (Base: ${session.baseRoi.toFixed(2)}%).<br>` +
            `<em>Note: Per credit policy, any Requested PF &lt; 1.5% requires mandatory CEO Approval.</em><br><br>` +
            `What <strong>Requested Processing Fee (PF %)</strong> are you seeking?`,
            [
              { label: `${session.basePf}% (Full PF)`, value: String(session.basePf), primary: true },
              { label: `1.8% (CBO band)`, value: "1.8" },
              { label: `1.5% (COO band)`, value: "1.5" },
              { label: `1.2% (< 1.5% CEO Floor)`, value: "1.2" }
            ], "talking"
          );
          break;

        case STEPS.REQUESTED_PF:
          const numPf = parseFloat(clean.replace(/%/g, ""));
          if (isNaN(numPf) || numPf < 0 || numPf > 15) {
            appendBotMessage(`Please enter a valid Processing Fee between <strong>0% and 15%</strong>:`, [{ label: `${session.basePf}%`, value: String(session.basePf) }], "worried");
            return;
          }
          session.requestedPf = numPf;
          session.step = STEPS.COMPLETED;
          inputHint.textContent = "Select an action below or test other rates";
          userInput.placeholder = "Click 'Try different ROI / PF' or 'New customer'";
          renderFullLoanVerdict();
          break;

        case STEPS.COMPLETED:
          if (clean.toLowerCase().includes("different") || clean.toLowerCase().includes("try")) {
            reAskRatesOnly();
          } else if (clean.toLowerCase().includes("new")) {
            restartConversation();
          } else {
            appendBotMessage(`Would you like to test another rate structure or start a new borrower assessment?`,
              [{ label: "Try different ROI / PF", icon: "✏️", primary: true }, { label: "New customer", icon: "👤" }], "idle"
            );
          }
          break;
      }
    }

    /* ==========================================================================
       RENDER COMPREHENSIVE VERDICT CARD
       ========================================================================== */
    function renderFullLoanVerdict() {
      const approval = determineFinalApproval(session.baseRoi, session.requestedRoi, session.basePf, session.requestedPf);
      const baseEmi = calculateReducingEMI(session.loanAmount, session.baseRoi, session.tenureMonths);
      const reqEmi = calculateReducingEMI(session.loanAmount, session.requestedRoi, session.tenureMonths);
      const emiDiff = baseEmi - reqEmi;
      const basePfAmount = (session.loanAmount * session.basePf) / 100.0;
      const reqPfAmount = (session.loanAmount * session.requestedPf) / 100.0;
      const pfSavings = basePfAmount - reqPfAmount;
      const dti = calculateDTI(session.existingEmis, reqEmi, session.monthlyIncome);

      let petMood = "celebrating";
      if (approval.finalApproverKey === "CBO") petMood = "happy";
      else if (approval.finalApproverKey === "COO") petMood = "surprised";
      else if (approval.finalApproverKey === "CEO") petMood = "worried";

      function getBadge(dev, bandType, isFloorBreached, requestedVal, floorVal) {
        if (isFloorBreached) {
          return `<span class="pill-badge ceo">⚠️ Below ${floorVal}% Floor (CEO)</span>`;
        }
        if (dev <= 0) return `<span class="pill-badge favorable">No Deviation (0.00%)</span>`;
        const appr = getApproverForDeviation(dev, bandType);
        return `<span class="pill-badge ${appr.toLowerCase()}">-${dev.toFixed(2)}% (${appr})</span>`;
      }

      const roiBadge = getBadge(approval.roiDeviation, "ROI", approval.roiFloorBreached, session.requestedRoi, CONFIG.ROI_FLOOR_PERCENT);
      const pfBadge = getBadge(approval.pfDeviation, "PF", approval.pfFloorBreached, session.requestedPf, CONFIG.PF_FLOOR_PERCENT);

      let bannerTitle = "";
      if (approval.finalApproverKey === "NONE") {
        bannerTitle = `✅ Standard Rate — No Escalation Required`;
      } else {
        bannerTitle = `🛡️ Approval Required: ${approval.finalApproverName}`;
      }

      const floorAlertHtml = (approval.roiFloorBreached || approval.pfFloorBreached) ? `
        <div style="margin-bottom:8px;">
          <span class="floor-alert-badge">🏛️ MANDATORY CEO FLOOR OVERRIDE TRIGGERED</span>
        </div>
      ` : '';

      const dtiAlertHtml = dti.warning ? `
        <div class="dti-alert-box">
          <span style="font-size:18px;">⚠️</span>
          <div>
            <strong>Prudent DTI Threshold Exceeded:</strong> The updated debt ratio (${dti.updatedDti}%) 
            surpasses our standard benchmark of ${CONFIG.DTI_LIMIT_PERCENT}%. Special risk assessment applies.
          </div>
        </div>` : '';

      const cardHtml = `
        <div class="result-card">
          <div class="verdict-banner ${approval.color}">
            <span>${bannerTitle}</span>
          </div>
          <div class="verdict-explanation">
            ${floorAlertHtml}
            ${approval.explanation}
          </div>
          <div class="comparison-table-wrapper">
            <table class="comparison-table">
              <thead>
                <tr>
                  <th>Parameter</th>
                  <th>Benchmark</th>
                  <th>Requested</th>
                  <th>Status & Authority</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td><strong>ROI (% p.a.)</strong></td>
                  <td>${session.baseRoi.toFixed(2)}%</td>
                  <td><strong>${session.requestedRoi.toFixed(2)}%</strong></td>
                  <td>${roiBadge}</td>
                </tr>
                <tr>
                  <td><strong>Processing Fee</strong></td>
                  <td>${session.basePf.toFixed(2)}% (${formatINR(basePfAmount)})</td>
                  <td><strong>${session.requestedPf.toFixed(2)}% (${formatINR(reqPfAmount)})</strong></td>
                  <td>${pfBadge}</td>
                </tr>
                <tr>
                  <td><strong>Monthly EMI</strong></td>
                  <td>${formatINR(baseEmi)}</td>
                  <td><strong>${formatINR(reqEmi)}</strong></td>
                  <td><span class="pill-badge ${emiDiff >= 0 ? 'favorable' : 'cbo'}">${emiDiff >= 0 ? 'Saves ' + formatINR(emiDiff) + '/m' : '+ ' + formatINR(Math.abs(emiDiff))}</span></td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="metrics-grid">
            <div class="metric-cell">
              <div class="metric-title">New Monthly EMI</div>
              <div class="metric-number" style="color:var(--accent-1);">${formatINR(reqEmi)}</div>
              <div class="metric-caption">${session.tenureMonths}m reducing rate</div>
            </div>
            <div class="metric-cell">
              <div class="metric-title">Monthly EMI Savings</div>
              <div class="metric-number" style="color:var(--color-green);">${formatINR(Math.max(0, emiDiff))}</div>
              <div class="metric-caption">${emiDiff > 0 ? 'Lower debt burden' : 'At standard rate'}</div>
            </div>
            <div class="metric-cell">
              <div class="metric-title">Upfront PF Amount</div>
              <div class="metric-number" style="color:var(--accent-pink);">${formatINR(reqPfAmount)}</div>
              <div class="metric-caption">Saves ${formatINR(Math.max(0, pfSavings))}</div>
            </div>
            <div class="metric-cell">
              <div class="metric-title">Updated DTI Ratio</div>
              <div class="metric-number" style="color:${dti.warning ? 'var(--color-amber)' : 'var(--color-green)'};">${dti.updatedDti}%</div>
              <div class="metric-caption">Was ${dti.currentDti}%</div>
            </div>
          </div>
          ${dtiAlertHtml}
        </div>`;

      appendBotMessage(
        `Here is the complete pricing & approval evaluation for <strong>${escapeHtml(session.customerName)}</strong>:<br>${cardHtml}`,
        [
          { label: "Try different ROI / PF", icon: "✏️", primary: true, value: "re_ask_rates" },
          { label: "New customer", icon: "👤", value: "new_customer" }
        ],
        petMood, 450
      );
    }

    function reAskRatesOnly() {
      session.step = STEPS.REQUESTED_ROI;
      inputHint.textContent = `Enter requested ROI % p.a. (Base is ${session.baseRoi}%)`;
      userInput.placeholder = `Benchmark is ${session.baseRoi}%, enter new ROI...`;
      appendBotMessage(
        `Let's adjust the proposal for <strong>${escapeHtml(session.customerName)}</strong>.<br>` +
        `All other inputs (Loan: ${formatINR(session.loanAmount)}, ${session.tenureMonths}m, Base: ${session.baseRoi}% / ${session.basePf}%) are retained.<br><br>` +
        `What new <strong>Requested ROI (% p.a.)</strong> would you like to evaluate?`,
        [
          { label: `${session.baseRoi}% (Base Rate)`, value: String(session.baseRoi), primary: true },
          { label: `${(session.baseRoi - 1.5).toFixed(1)}% (CBO)`, value: String(session.baseRoi - 1.5) },
          { label: `${(session.baseRoi - 3.0).toFixed(1)}% (COO)`, value: String(session.baseRoi - 3.0) },
          { label: `14.5% (< 15% CEO Floor)`, value: "14.5" }
        ], "talking"
      );
    }

    const originalOnChipSelected = onChipSelected;
    onChipSelected = function(val) {
      if (val === "re_ask_rates") {
        appendUserMessage("Try different ROI / PF");
        reAskRatesOnly();
      } else if (val === "new_customer" || val === "restart") {
        appendUserMessage("New customer");
        restartConversation();
      } else {
        originalOnChipSelected(val);
      }
    };

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", () => { scrollChatToBottom(); });
    }
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
    window.addEventListener("DOMContentLoaded", () => { startDialogue(); });
  </script>
</body>
</html>
